services:


  # Основное приложение maintmode
  maintmode:
    build:
      context: .
      dockerfile: ./.build/Dockerfile
    container_name: maintmode
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    environment:
#      ENVIRONMENT: dev
      ENVIRONMENT: performance_test # for performance test
      DB_DSN: postgres://postgres:postgres@pg_doorman:6432/maintmode?sslmode=disable
      DB_DRIVER: postgres
      DB_MAX_OPEN_CONNS: 50
      DB_MAX_IDLE_CONNS: 20
      DB_CONNECTION_MAX_LIFETIME: 10m
      DB_CONNECTION_MAX_IDLE_TIME: 5m
      APP_TRACER_COLLECTOR_HOST: otel-collector
      APP_TRACER_COLLECTOR_PORT: 4317
    depends_on:
      postgres:
        condition: service_healthy
      pg_doorman:
        condition: service_started
      apply-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - theapp

