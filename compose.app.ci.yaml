services:
  maintmode:
    image: maintmode-ci-maintmode:${MAINTMODE_IMAGE_TAG:-local}
    build: null

  # Use the prebuilt custom Caddy image (built once with buildx + GHA cache
  # in the api-test job) instead of rebuilding it via xcaddy on every
  # `compose up`. The xcaddy build is ~minutes; the Dockerfile rarely
  # changes, so the cache is almost always a hit.
  caddy:
    image: maintmode-ci-caddy:${CADDY_IMAGE_TAG:-local}
    build: null
