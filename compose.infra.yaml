services:
  # VictoriaMetrics - Time Series Database для метрик
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    container_name: victoria-metrics
    restart: unless-stopped
    ports:
      - "8428:8428"
      - "8429:8429"
    volumes:
      - victoria-metrics:/victoria-metrics-data
      - ./monitoring/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=30d"
    networks:
      - theapp

  # Grafana - Визуализация метрик
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "8003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
      GF_INSTALL_PLUGINS: grafana-pyroscope-datasource
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoria-metrics
      - loki
    networks:
      - theapp

  # Loki - Агрегация логов
  loki:
    image: grafana/loki:3.3.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki:/loki
      - ./monitoring/config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - theapp

  # Promtail - Сбор логов из контейнеров
  promtail:
    image: grafana/promtail:3.3.0
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/config/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - theapp

  # PostgreSQL Exporter - Метрики PostgreSQL
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/maintmode?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - theapp

  # Redis Exporter - Метрики Redis
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - theapp

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317"        # Внутренний gRPC
    networks:
      - theapp

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/config/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # Порт для нашего Go-кода
    depends_on:
      - jaeger
    networks:
      - theapp

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "4040" # internal port
    command:
      - "server"
    networks:
      - theapp

  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345" # UI агента (полезно для дебага пайплайнов)
    volumes:
      - ./monitoring/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - pyroscope
    networks:
      - theapp

volumes:
  victoria-metrics:
  grafana:
  loki: