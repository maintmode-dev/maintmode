[general]
host = "0.0.0.0"
port = 6432
connect_timeout = 3000
query_wait_timeout = 5000
idle_timeout = 300000000
tcp_keepalives_idle = 5
tcp_keepalives_count = 5
tcp_keepalives_interval = 5
tcp_so_linger = 0
tcp_no_delay = true
unix_socket_buffer_size = 1048576
log_client_connections = true
log_client_disconnections = true
shutdown_timeout = 10000
message_size_to_be_stream = 1048576
max_memory_usage = 268435456
max_connections = 8192
max_concurrent_creates = 4
server_lifetime = 300000
retain_connections_time = 60000
server_round_robin = false
sync_server_parameters = false
worker_threads = 4
proxy_copy_data_timeout = 15000
worker_cpu_affinity_pinning = false
backlog = 0
pooler_check_query = ";"
tls_rate_limit_per_second = 0
server_tls = false
verify_server_certificate = false
# TODO(RUK-21 follow-up): pg_doorman.toml does not support env-var
# interpolation today. For prod, generate this file from a template at
# deploy time, or fork the file as pg_doorman.prod.toml with rotated
# credentials. The admin endpoint is reachable only on the internal
# Docker network, so the risk is bounded but real.
admin_username = "admin"
admin_password = "admin"
prepared_statements = true
prepared_statements_cache_size = 8192
client_prepared_statements_cache_size = 0
daemon_pid_file = "/tmp/pg_doorman.pid"

[prometheus]
host = "0.0.0.0"
port = 9127
enabled = true

[pools.maintmode]
pool_mode = "Transaction"
cleanup_server_connections = false
log_client_parameter_status_changes = false
server_host = "postgres"
server_port = 5432
server_database = "maintmode"

[[pools.maintmode.users]]
username = "postgres"
password = "SCRAM-SHA-256$4096:bNSQCT2uQ/GB1ephKgakRg==$4AWPZ0m+4lC9KjGg8VAQdT3/UcC/TMCTQJFXUGCdsMU=:X81IrLtCsSKS6rk8zH8ZgLp6ikkOpzl3XKEgks5YOrA="
server_username = "postgres"
server_password = "postgres"
pool_size = 40
