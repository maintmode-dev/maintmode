# maintmode — prod secrets (sample).
#
# Real prod secrets are NEVER committed and never written to disk on the host:
# CD injects app.secrets.yaml into tmpfs (/dev/shm) from the GitHub Secret
# APP_SECRETS_MAINTMODE. This sample documents the required key set — copy and
# fill it only for a manual/local prod-shaped bring-up:
#   cp deployment/maintmode/prod/app.secrets.sample.yaml \
#      deployment/maintmode/prod/app.secrets.yaml
#
# The resolver hard-fails on a missing key (internal/config/app_secrets.go), so
# every key below must be present in whatever store feeds a real deploy.

db/dsn: "replace-me-prod-value"
valkey/password: "replace-me-prod-value"

# Google OAuth — client_id ONLY.
#
# There is deliberately no client_secret in prod, or anywhere else in this
# service. The BFF (maintmode-ui, NextAuth) owns the authorization-code
# exchange with Google and holds the only copy of the secret; the backend
# verifies the resulting id_token offline against Google's JWKS, using this
# client_id as the expected audience.
#
# Must match the client the BFF uses (MAINTMODE_GOOGLE_OAUTH_CLIENT_ID) or
# every token fails audience validation.
oauth/google/client_id: "replace-me-prod-value"

# Auth/JWT — the merged process mints and verifies its own tokens (RUK-194).
#   issuer_private_key      hex-encoded raw P-256 private key (JWT signing key)
#   issuer_kid              key id advertised in the in-process JWKS
#   oauth_state_signing_key generate: openssl rand -hex 32
jwt/issuer_private_key: "replace-me-prod-value"
jwt/issuer_kid: "replace-me-prod-value"
jwt/oauth_state_signing_key: "replace-me-prod-value-32-bytes-hex"

# Transport credentials (Slack/Telegram/SMTP) are no longer sourced from secrets:
# they live encrypted in the DB-backed integration registry (RUK-196), configured
# at runtime via POST /api/v1/integrations.
#
# KEK for integration-secret envelope encryption. 32-byte key, hex-encoded (64 hex chars).
# Generate with: openssl rand -hex 32
# Rotation: add the NEW key here as crypto/kek/prod-2 and reference it in
# local_keys one deploy BEFORE flipping active_kek_uri (two-phase — see the
# crypto section of app.config.yaml). Keep the old key present until no
# data_keys row references it and no rollback across the flip is possible.
"crypto/kek/prod-1": "replace-me-prod-value-32-bytes-hex"
