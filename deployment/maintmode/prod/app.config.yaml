environment: prod

app:
  # Used by the auth OAuth callback/exchange to redirect back to the frontend.
  # Moved in from the auth config — the merged process serves the auth
  # routes, so it needs this or those redirects target an empty URL.
  frontend_url: https://maintmode.example.com
  # The frontend route the OAuth dance sends the browser back to, appended to
  # frontend_url. It belongs to the frontend rather than to this service, so a
  # rename there needs no backend release.
  #
  # Required whenever the dance is armed, with no in-code default: a value from
  # config and another from the binary would mean two places to look when a
  # redirect lands somewhere unexpected. Leaving it empty leaves the dance
  # unregistered rather than redirecting to the frontend's bare origin.
  oauth_callback_path: /auth/oauth/callback

  # The Path attribute of the two dance cookies, and it must be the EXTERNAL
  # prefix the browser sees. Caddy serves this backend under
  # `handle_path /auth/*` and STRIPS the prefix, so the app sees
  # /api/v1/login/oauth/... while the browser's URL space is
  # /auth/api/v1/login/oauth/... A cookie scoped to what the app sees is never
  # sent back on the callback, and the dance then dies as a 302 that reads as
  # success in every access log.
  #
  # Keep it the narrowest prefix covering both /start and /callback. Widening to
  # "/" also works and only means two httpOnly, minutes-long cookies travel more
  # than they need; narrowing past the shared prefix breaks every sign-in.
  #
  # Required whenever the dance is armed, with no in-code default: leaving it
  # empty is not inert — the attribute is then omitted and the browser scopes
  # the cookie to the internal request path, which is exactly the value that
  # never comes back. So an empty value leaves the dance unregistered instead.
  oauth_cookie_path: /auth/api/v1/login/oauth

auth:
  # Invite-only: an unknown user without an invitation is rejected with 403
  # signup_disabled, on a fresh instance too. The first admin signs in through
  # break-glass (bootstrap). Enable open signup only deliberately.
  allow_open_signup: false
  # How long an emailed code stays valid. Short on purpose: a code delivered by
  # email is guessable in principle, and this window plus the attempt ceiling
  # below are what bound that. The web UI assumes 5m for its countdowns
  # (CODE_TTL_SECONDS in maintmode-ui);
  # change both together.
  otp_ttl: 5m
  # How long a signed OAuth-dance state stays valid: the span from pressing
  # "sign in" to finishing a consent screen, password prompt and second factor
  # included. Enforced by the signature rather than by the cookie's MaxAge, so
  # lengthening it widens a real window — a captured (state, cookie) pair is
  # replayable for exactly this long.
  oauth_dance_state_ttl: 10m
  # The minimum time BOTH one-time-code endpoints take to answer, whatever they
  # did. This is a security knob, not a throttle, and its VALUE is the property:
  # an address with no account is refused after a single indexed SELECT, while a
  # real one costs a second SELECT, an attempt claim, a hash and a comparison.
  # Without a floor those two are separable by a stopwatch, and enumeration needs
  # only one request per candidate address -- which no rate limit can stop.
  #
  # It bounds the fast branch from below and cannot bound the slow one from
  # above, so it must stay ABOVE what verification actually costs on this
  # deployment. Raise it if the slow path ever grows past it.
  otp_response_floor: 300ms
  # How many guesses one emailed code accepts before it is spent. Burning them
  # does NOT free the active-code slot: no new code is issued until the spent
  # one expires, or "five attempts" would mean "five per code, unlimited codes".
  # Non-positive falls back to 5; anything above 10 is clamped.
  otp_max_attempts: 5
  # Least time between two codes for one user. A request while the live code
  # is younger than this sends nothing and leaves that code in place, so
  # someone requesting codes for an address cannot keep retiring its owner's
  # code before it is typed in. Kept short on purpose: whoever requests a code
  # once per cooldown holds the slot, and the owner's requests go unanswered
  # meanwhile. Non-positive falls back to 1m; capped at otp_ttl.
  # The web UI assumes 1m (OTP_REISSUE_COOLDOWN_SECONDS in maintmode-ui) to
  # decide when to keep its nonce; change both together, or a longer value
  # here makes the UI replace a working nonce with a dead one.
  otp_reissue_cooldown: 1m

jwtverifier:
  # Tokens are checked against the public half of jwt.issuer_private_key,
  # derived in-process: nothing is fetched.
  jwt_issuer: oauth-service
  jwt_leeway: 30s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: info

api_server:
  name: api
  host: 0.0.0.0
  port: 8000
  # Rate limiter for the auth login surface (/login/oauth), now served by the
  # merged process. Moved in from the auth config — without it the
  # login/oauth endpoints lose their per-IP cap.
  rate_limiter:
    requests_per_minute: 30
    burst: 30
    expires_in: 3m
    timeout: 200ms
  # Rate limiter for the /ui/v1 screen group. Keyed by user id from
  # the token, not by IP: a whole team behind one corporate NAT shares an
  # address, and an IP key would let one person's polling loop throttle their
  # colleagues. Separate from the block above because that one is an
  # anti-enumeration ceiling on the login surface — 30/min would break page
  # loads here, where the screen routes are called in batches.
  #
  # 300/min is 5 rps sustained: well above any live navigation, well below what
  # a polling loop draws. It separates a machine from a person, which is all it
  # is for — a valid token is required either way.
  ui_rate_limiter:
    requests_per_minute: 300
    burst: 300
    expires_in: 3m
    timeout: 200ms
  # One-time-code limiters. Both key on something the per-IP limiter above
  # cannot: a distributed attacker changes address for free, so the per-IP cap
  # alone leaves both "grind one victim's code from many IPs" and "one request
  # per address from each of a thousand IPs" unbounded.
  #
  # The per-address budget covers a whole attempt cycle -- one request plus up
  # to otp_max_attempts guesses -- with room for a confused user retrying, and
  # is not what bounds guessing: the per-code ceiling does that far more
  # tightly.
  otp_email_rate_limiter:
    requests_per_minute: 20
    burst: 20
    expires_in: 3m
    timeout: 200ms
  # The instance-wide budget, and the only tier that sees a sweep spread across
  # both addresses and IPs. At the per-address cap above it binds at roughly
  # thirty distinct addresses a minute, which is the number to tune against.
  #
  # On a Valkey outage this tier stops applying rather than falling back to a
  # per-replica bucket: its key is a constant, so one shared in-memory bucket
  # would let a single attacker hold the whole sign-in surface at 429.
  otp_global_rate_limiter:
    requests_per_minute: 600
    burst: 600
    expires_in: 3m
    timeout: 200ms
  # Socket-level deadlines for the public port — connection hygiene, not request
  # budgets. These mirror the code defaults (see ServerTimeouts in
  # internal/config); they are written out here because this is the port exposed
  # to untrusted clients and the numbers are coupled to things outside this file.
  #
  # Omitting a key does NOT disable a deadline: unset falls back to the same
  # default. A negative value is the explicit "no deadline" escape hatch.
  timeouts:
    # Closes slowloris on the header phase.
    read_header: 10s
    # Whole request read, headers and body. Same as the 30s Echo pre-sets.
    read: 30s
    # Must stay above any per-request timeout enforced in middleware: a shorter
    # socket deadline severs a handler the app was still willing to run. Nothing
    # here streams, so a fixed cap is safe.
    write: 30s
    # Must exceed the polling interval of everything on a schedule, or each poll
    # pays a fresh handshake: Caddy health_interval (2s, deployment/caddy) and
    # the Prometheus/Alloy scrape_interval (15s, monitoring/config).
    idle: 75s

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001
  # No write deadline on this port: it serves /debug/pprof, and a CPU profile
  # blocks for its whole sampling window before the body is complete — a fixed
  # WriteTimeout truncates it. Leaving `write` unset here is what selects that
  # (InfraServerTimeouts), so do not "fix" it by adding a value. The read and
  # idle deadlines below still apply.
  timeouts:
    read_header: 10s
    read: 30s
    idle: 75s

# Graceful-shutdown drain delay. On SIGTERM the process reports
# Readiness=503 and waits this long before closing the HTTP server, so
# Caddy ejects the replica from its pool before connections stop. Must
# exceed Caddy's active health_interval (2s in deployment/caddy/Caddyfile). Basis for
# zero-downtime rolling deploys.
shutdown:
  drain_timeout: 6s

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  enabled: true
  collector_host: otel-collector
  collector_port: 4317

valkey:
  addr: valkey:6379
  password: <secret:valkey/password>
  db: 0

oauth_providers:
  # One section per login provider, flat like Grafana's [auth.github]: the
  # provider's facts (display_name, issuer_url, authorize_url, token_url,
  # api_base_url) and, when it is declared here, its settings side by side.
  #
  # managed_by is REQUIRED and says who owns the provider:
  #   - ui: an admin creates and runs it in the UI, supplying only their own
  #     OAuth client (client_id, client_secret, redirect_uri). The entry holds
  #     the facts and nothing else; they are copied into the provider when it
  #     is created and cannot be changed in the UI -- a provider name that
  #     already has accounts behind it must not be re-pointable at a host
  #     someone else controls.
  #   - config: the provider is declared HERE, for an operator who keeps
  #     secrets in their own store and renders the secrets file from it.
  #     enabled is required; with enabled: true the settings are too.
  #       - the provider's secrets (client_secret) must be <secret:KEY>
  #         references into the secrets file, never literals; any other value
  #         may be one too;
  #       - a key the provider does not read fails startup, even when
  #         enabled: false;
  #       - the provider is read-only in the UI and API, and its secret is never
  #         stored in the database; enabled: false pins it off;
  #       - changes apply on restart;
  #       - declaring a provider an admin already created TAKES IT OVER: linked
  #         accounts are kept, and the secret stored in the database is wiped.
  # To hand a provider over to the UI, set managed_by: ui and keep only its
  # facts. It stays disabled until an admin enables it with a client_secret.
  # `custom` ships no facts: declared here it carries all of its own.
  # The binary and this file change format together; roll them back together.
  providers:
    google:
      display_name: Google
      issuer_url: https://accounts.google.com
      managed_by: ui
      # To declare it here instead:
      # managed_by: config
      # enabled: true
      # client_id: "1234.apps.googleusercontent.com"
      # redirect_uri: "https://maint.example.com/auth/api/v1/login/oauth/google/callback"
      # client_secret: <secret:auth_provider/google/client_secret>
    # GitHub publishes no discovery document, so its endpoints cannot be
    # fetched the way an OIDC issuer's are -- they are configuration. Editing
    # them here is a deploy-time act, which is what makes a GitHub Enterprise
    # Server or a test double possible without a rebuild.
    github:
      display_name: GitHub
      authorize_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_base_url: https://api.github.com
      managed_by: ui

jwt:
  issuer_name: oauth-service
  issuer_private_key: <secret:jwt/issuer_private_key>
  issuer_kid: <secret:jwt/issuer_kid>
  access_token_ttl: 15m
  refresh_token_ttl: 720h # 30 days
  # Session policy, mirroring Grafana\'s two-limit model: idleness is
  # renewed by activity, the maximum is not. Neither is stored on the token
  # row, so changing either affects sessions that already exist.
  session_inactive_lifetime: 168h  # signed out after this long without activity
  session_max_lifetime: 720h      # hard ceiling from sign-in; activity does not extend it
  refresh_token_grace_period: 30s
  refresh_token_distributed_lock_ttl: 5s

# The channel catalog lives in Postgres (messenger_channels), not here:
# create channels via POST /api/v1/notifications/channels so they are
# consistent across all instances without a restart.
notify_transport:
  # A transport's credentials (Slack/Telegram/SMTP) are either entered by an
  # admin at runtime (POST /api/v1/integrations, no redeploy) or declared under
  # transports below. In prod the stub is never used; every delivery resolves
  # the real transport.
  use_stub: false
  # allow_internal_hosts lets the transports (and the SMTP probe) connect to
  # loopback, private and other internal addresses. Leave it off unless a
  # transport genuinely lives on the internal network (e.g. a corporate SMTP
  # relay on 10.x): the Slack/Telegram api_url and the SMTP host are typed by
  # an admin, and with it on they reach whatever this process can reach.
  allow_internal_hosts: false
  # One section per notify transport (slack, telegram, email), flat: managed_by,
  # enabled and the transport's settings side by side. A transport with no
  # section is managed in the UI.
  #
  # managed_by is REQUIRED and says who owns the transport:
  #   - ui: an admin configures and enables it in the UI. The section holds
  #     nothing else; anything more in it is ignored.
  #   - config: the transport is declared HERE, for an operator who keeps
  #     secrets in their own store and renders the secrets file from it.
  #     enabled is required; with enabled: true the settings are too.
  #       - its secret (bot_token for slack and telegram, password for email)
  #         must be a <secret:KEY> reference into the secrets file, never a
  #         literal. Only that key is read from a reference: write every other
  #         setting as a plain value. A referenced key must exist in the
  #         secrets file even when enabled: false;
  #       - a key the transport does not read fails startup, even when
  #         enabled: false -- the settings are shown in the admin UI as written;
  #       - the transport is read-only in the UI and API, and its secret is
  #         never stored in the database; enabled: false pins it off;
  #       - changes apply on restart;
  #       - declaring a transport an admin already configured TAKES IT OVER:
  #         the secret stored in the database is wiped, and neither the UI nor
  #         the API can show it -- put the original token in your secret store
  #         first, or issue a new one.
  # Removing a section, or switching it to managed_by: ui, hands the transport
  # back to the UI switched off: deliveries through it are dropped until an
  # admin enables it with its secret.
  # email also carries sign-in codes (OTP) and invitations, so a broken or
  # released email transport stops OTP sign-in; the way back in is the
  # break-glass password or an OAuth provider.
  transports:
    slack:
      managed_by: ui
      # To declare it here instead:
      # managed_by: config
      # enabled: true
      # bot_token: <secret:notify/slack/bot_token>
    telegram:
      managed_by: ui
    email:
      managed_by: ui
      # To declare it here instead:
      # managed_by: config
      # enabled: true
      # host: smtp.example.com
      # port: 587
      # tls_policy: mandatory
      # from: "maintmode@example.com"
      # username: maintmode
      # password: <secret:notify/email/password>

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
    # Poll period of the emails a person waits for on screen (invitation.email,
    # otp.email: sign-in and password-reset codes). Background processors keep
    # goque's 30s default; these must not, or a code arrives half a reissue
    # cooldown late. One indexed claim query per processor per tick. Default 1s.
    user_email_fetch_tick: 1s
  maint_auto_cancel:
    # 5-field cron: "minute hour day-of-month month day-of-week".
    # "* * * * *" = every minute (every value in every field).
    cron_spec: "* * * * *"
    threshold: 15m
    batch_limit: 100
  # audit_prune moved in with auth: the merged process owns the
  # audit-retention cron, so its spec must live here or NewTaskProcessors panics
  # building the cron job ("empty spec string").
  audit_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000
  # invitation_rotate/invitation_prune: the merged process owns the
  # invitation lifecycle, so these cron specs must be set or NewTaskProcessors
  # panics building the cron job ("empty spec string").
  invitation_rotate:
    cron_spec: "0 3 * * *"
    batch_limit: 1000
  invitation_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000
  # otp_prune deletes spent one-time codes: rows with kind='otp' whose expires_at
  # is older than retention. Consumed and merely-expired codes leave through the
  # same threshold; password rows are never touched.
  #
  # Retention is short (unlike the year the other sweeps keep) because the row
  # holds a code digest and a session nonce while the code itself lives minutes.
  # Worst-case residency is retention plus one cron period, so ~48h here, not 24h.
  #
  # cron_spec must be set here: like audit_prune and invitation_prune, an empty
  # or malformed value fails NewTaskProcessors and aborts startup. The 03:15
  # offset keeps this sweep out of the minute the three other daily jobs share.
  otp_prune:
    cron_spec: "15 3 * * *"
    retention: 24h
    batch_limit: 1000

# crypto addresses the master key (KEK) that wraps the data-encryption keys
# protecting integration secrets at rest. A KEK is addressed by URI:
# local-kms://<id> is served from local_keys (URI -> hex-encoded 32-byte key);
# a cloud KMS would point active_kek_uri at the provider URI (gcp-kms://...,
# aws-kms://...) and wire that provider's KMSClient in bootstrap (the config
# contract itself does not change).
#
# KEK rotation is TWO-PHASE (startup auto-re-wraps data_keys onto active_kek_uri,
# so rollbacks matter):
#   A. deploy: add "local-kms://prod-2" + its secret to local_keys, keep
#      active_kek_uri on prod-1;
#   B. deploy: flip active_kek_uri to prod-2 (boot re-wraps every DEK).
# Rollback B -> A is self-healing (A knows prod-2 and re-wraps back). NEVER roll
# back past A after B has booted: a config that has never seen prod-2 cannot
# unwrap any DEK — integrations stay configured but every secret is unreadable
# until the key is restored. Drop prod-1 from local_keys only after B is settled
# and a rollback across the flip is impossible.
#
# The keyring fails fast on an empty/unsupported/weak KEK, so a bad value aborts
# startup. The real KEK value is injected from the runtime-mounted secrets file
# (never git).
crypto:
  active_kek_uri: local-kms://prod-1
  local_keys:
    "local-kms://prod-1": <secret:crypto/kek/prod-1>

# Break-glass admin sign-in (POST /api/v1/login/break-glass).
#
# The password is a secret and lives in app.secrets.yaml under
# "bootstrap/password", alongside every other credential — not inline here, and
# with no environment-variable override: an env var is readable by anything that
# can inspect the process or the compose file.
#
# An EMPTY secret is valid and means this instance has NO break-glass: sign-in
# then goes through the ordinary methods only, and the app says so at startup.
# The key itself must exist in the secrets file even when empty — the resolver
# hard-fails on a missing key, so a deployment whose secrets predate this key
# will not start until it is added.
#
# Set a real value on any deployment that needs an emergency entrance: without
# one there is no way in should the ordinary methods become unusable.
bootstrap:
  password: <secret:bootstrap/password>
