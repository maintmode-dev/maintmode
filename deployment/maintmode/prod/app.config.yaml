environment: prod

app:

jwtverifier:
  jwt_issuer: oauth-service
  jwks_url: http://auth:8000/api/v1/.well-known/jwks.json
  jwks_refresh_interval: 1h
  jwks_http_timeout: 10s
  jwt_leeway: 30s
  jwks_unknown_kid_refresh_rate: 5m
  jwks_unknown_kid_wait_max: 10s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: info

api_server:
  name: api
  host: 0.0.0.0
  port: 8000

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001

# Graceful-shutdown drain delay. On SIGTERM the process reports
# Readiness=503 and waits this long before closing the HTTP server, so
# Caddy ejects the replica from its pool before connections stop. Must
# exceed Caddy's active health_interval (see Caddyfile.prod). Basis for
# zero-downtime rolling deploys (RUK-147).
shutdown:
  drain_timeout: 6s

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  collector_host: otel-collector
  collector_port: 4317

redis:
  addr: redis:6379
  password: <secret:redis/password>
  db: 0

external_services:
  auth:
    secret: <secret:external_services/auth/secret>
    protocol: http
    host: auth
    port: 8000
    timeout: 3s

s2s:

# The channel catalog lives in Postgres (messenger_channels), not here:
# create channels via POST /api/v1/notifications/channels so they are
# consistent across all instances without a restart.
notify_transport:
  slack:
    enabled: true
    bot_token: <secret:messengers/slack/bot_token>
    # api_url overrides the default Slack API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s
  telegram:
    enabled: true
    bot_token: <secret:messengers/telegram/bot_token>
    # api_url overrides the default Telegram Bot API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s
  email:
    # SMTP delivery for invitation emails. host/from must point at the real
    # provider; credentials come from secrets, never inline.
    enabled: true
    host: <secret:messengers/email/host>
    port: 587
    username: <secret:messengers/email/username>
    password: <secret:messengers/email/password>
    from: <secret:messengers/email/from>
    reply_to: ""
    tls_policy: "mandatory"
    timeout: 10s

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
  maint_auto_cancel:
    # 5-field cron: "minute hour day-of-month month day-of-week".
    # "* * * * *" = every minute (every value in every field).
    cron_spec: "* * * * *"
    threshold: 15m
    batch_limit: 100
