environment: prod

app:
  # Used by the auth OAuth callback/exchange to redirect back to the frontend.
  # Moved in from the auth config — the merged process serves the auth
  # routes, so it needs this or those redirects target an empty URL.
  frontend_url: https://maintmode.example.com

auth:
  # Invite-only: an unknown user without an invitation is rejected with 403
  # signup_disabled. The very first login still bootstraps the first admin.
  # Enable open signup only deliberately, and only after that bootstrap has
  # completed.
  allow_open_signup: false

jwtverifier:
  jwt_issuer: oauth-service
  # In-process JWKS: the merged maintmode process serves /.well-known/jwks.json
  # itself, so the verifier fetches from localhost, not the removed
  # auth service.
  jwks_url: http://localhost:8000/api/v1/.well-known/jwks.json
  jwks_refresh_interval: 1h
  jwks_http_timeout: 10s
  jwt_leeway: 30s
  jwks_unknown_kid_refresh_rate: 5m
  jwks_unknown_kid_wait_max: 10s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: info

api_server:
  name: api
  host: 0.0.0.0
  port: 8000
  # Rate limiter for the auth login surface (/login/oauth), now served by the
  # merged process. Moved in from the auth config — without it the
  # login/oauth endpoints lose their per-IP cap.
  rate_limiter:
    requests_per_minute: 30
    burst: 30
    expires_in: 3m
    timeout: 200ms
  # Rate limiter for the /ui/v1 screen group. Keyed by user id from
  # the token, not by IP: a whole team behind one corporate NAT shares an
  # address, and an IP key would let one person's polling loop throttle their
  # colleagues. Separate from the block above because that one is an
  # anti-enumeration ceiling on the login surface — 30/min would break page
  # loads here, where the screen routes are called in batches.
  #
  # 300/min is 5 rps sustained: well above any live navigation, well below what
  # a polling loop draws. It separates a machine from a person, which is all it
  # is for — a valid token is required either way.
  ui_rate_limiter:
    requests_per_minute: 300
    burst: 300
    expires_in: 3m
    timeout: 200ms
  # Socket-level deadlines for the public port — connection hygiene, not request
  # budgets. These mirror the code defaults (see ServerTimeouts in
  # internal/config); they are written out here because this is the port exposed
  # to untrusted clients and the numbers are coupled to things outside this file.
  #
  # Omitting a key does NOT disable a deadline: unset falls back to the same
  # default. A negative value is the explicit "no deadline" escape hatch.
  timeouts:
    # Closes slowloris on the header phase.
    read_header: 10s
    # Whole request read, headers and body. Same as the 30s Echo pre-sets.
    read: 30s
    # Must stay above any per-request timeout enforced in middleware: a shorter
    # socket deadline severs a handler the app was still willing to run. Nothing
    # here streams, so a fixed cap is safe.
    write: 30s
    # Must exceed the polling interval of everything on a schedule, or each poll
    # pays a fresh handshake: Caddy health_interval (2s, deployment/caddy) and
    # the Prometheus/Alloy scrape_interval (15s, monitoring/config).
    idle: 75s

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001
  # No write deadline on this port: it serves /debug/pprof, and a CPU profile
  # blocks for its whole sampling window before the body is complete — a fixed
  # WriteTimeout truncates it. Leaving `write` unset here is what selects that
  # (InfraServerTimeouts), so do not "fix" it by adding a value. The read and
  # idle deadlines below still apply.
  timeouts:
    read_header: 10s
    read: 30s
    idle: 75s

# Graceful-shutdown drain delay. On SIGTERM the process reports
# Readiness=503 and waits this long before closing the HTTP server, so
# Caddy ejects the replica from its pool before connections stop. Must
# exceed Caddy's active health_interval (see Caddyfile.prod). Basis for
# zero-downtime rolling deploys.
shutdown:
  drain_timeout: 6s

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  collector_host: otel-collector
  collector_port: 4317

valkey:
  addr: valkey:6379
  password: <secret:valkey/password>
  db: 0

oauth_providers:
  google:
    client_id: <secret:oauth/google/client_id>
    jwtverifier:
      jwks_url: https://www.googleapis.com/oauth2/v3/certs
      jwt_issuers:
        - "accounts.google.com"
        - "https://accounts.google.com"
      jwks_refresh_interval: 1h
      jwks_http_timeout: 10s
      jwt_leeway: 30s
      jwks_unknown_kid_refresh_rate: 5m
      jwks_unknown_kid_wait_max: 10s

jwt:
  issuer_name: oauth-service
  issuer_private_key: <secret:jwt/issuer_private_key>
  issuer_kid: <secret:jwt/issuer_kid>
  access_token_ttl: 15m
  refresh_token_ttl: 720h # 30 days
  refresh_token_grace_period: 30s
  refresh_token_distributed_lock_ttl: 5s

# The channel catalog lives in Postgres (messenger_channels), not here:
# create channels via POST /api/v1/notifications/channels so they are
# consistent across all instances without a restart.
notify_transport:
  # Per-transport credentials (Slack/Telegram/SMTP) now live in the DB-backed
  # integration registry — an admin configures and enables each
  # transport at runtime via POST /api/v1/integrations, no redeploy. In prod the
  # stub is never used; every delivery resolves the real transport from the DB.
  use_stub: false

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
  maint_auto_cancel:
    # 5-field cron: "minute hour day-of-month month day-of-week".
    # "* * * * *" = every minute (every value in every field).
    cron_spec: "* * * * *"
    threshold: 15m
    batch_limit: 100
  # audit_prune moved in with auth: the merged process owns the
  # audit-retention cron, so its spec must live here or NewTaskProcessors panics
  # building the cron job ("empty spec string").
  audit_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000
  # invitation_rotate/invitation_prune: the merged process owns the
  # invitation lifecycle, so these cron specs must be set or NewTaskProcessors
  # panics building the cron job ("empty spec string").
  invitation_rotate:
    cron_spec: "0 3 * * *"
    batch_limit: 1000
  invitation_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000

# crypto addresses the master key (KEK) that wraps the data-encryption keys
# protecting integration secrets at rest. A KEK is addressed by URI:
# local-kms://<id> is served from local_keys (URI -> hex-encoded 32-byte key);
# a cloud KMS would point active_kek_uri at the provider URI (gcp-kms://...,
# aws-kms://...) and wire that provider's KMSClient in bootstrap (the config
# contract itself does not change).
#
# KEK rotation is TWO-PHASE (startup auto-re-wraps data_keys onto active_kek_uri,
# so rollbacks matter):
#   A. deploy: add "local-kms://prod-2" + its secret to local_keys, keep
#      active_kek_uri on prod-1;
#   B. deploy: flip active_kek_uri to prod-2 (boot re-wraps every DEK).
# Rollback B -> A is self-healing (A knows prod-2 and re-wraps back). NEVER roll
# back past A after B has booted: a config that has never seen prod-2 cannot
# unwrap any DEK — integrations stay configured but every secret is unreadable
# until the key is restored. Drop prod-1 from local_keys only after B is settled
# and a rollback across the flip is impossible.
#
# The keyring fails fast on an empty/unsupported/weak KEK, so a bad value aborts
# startup. The real KEK value is injected from the runtime-mounted secrets file
# (never git).
crypto:
  active_kek_uri: local-kms://prod-1
  local_keys:
    "local-kms://prod-1": <secret:crypto/kek/prod-1>
