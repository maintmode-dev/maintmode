# maintmode — test secrets (sample).
#
# Restore a working file with:
#   cp deployment/maintmode/test/app.secrets.sample.yaml \
#      deployment/maintmode/test/app.secrets.yaml
#
# Used by the integration-test stack (`make tloc-api` and friends). The OAuth
# provider runs as a stub in this environment (oauth_providers.use_stub: true
# in test/app.config.yaml), so the client_id below is never sent to Google —
# it only has to be well-formed enough for config validation to pass.
#
# app.secrets.yaml is gitignored in every environment. Everything here is a
# throwaway value and can be used as-is.
#
# THREAT MODEL: test is explicitly OUT of the at-rest threat model. Nothing
# here protects anything real. Never put a live credential in this file — it
# is the sample, and samples get committed.

db/dsn: "postgres://postgres:postgres@pg_doorman:6432/maintmode?sslmode=disable"
redis/password: ""

# Google OAuth — client_id ONLY.
#
# There is deliberately no client_secret: the BFF (maintmode-ui, NextAuth) owns
# the authorization-code exchange with Google; the backend only verifies the
# resulting id_token against Google's JWKS. Do not add a client_secret here —
# the code no longer reads one.
#
# Placeholder is fine: the stub provider short-circuits verification in test.
"oauth/google/client_id": "test-client-id.apps.googleusercontent.com"

# JWT signing — the merged binary mints and verifies its own tokens (RUK-194).
"jwt/issuer_private_key": "1be2f1f68285c972b750b7718b00d5453f2c08f88c7894d1b9013f75a439de20"
"jwt/issuer_kid": "99d1e557df9b619fd046322c1e7f196e"
"jwt/oauth_state_signing_key": "0cfa7e1c96b436a10c884eee2ecd450e4fd0bc3ecd5e0a67561a1d653dba3d30"

# KEK for integration-secret envelope encryption (32-byte hex). Test-only sample.
"crypto/kek/test-1": "54219ec89dcaa6fb14527d8f6296140ea7c975bc80d6bfa1c251b699c780a93c"
