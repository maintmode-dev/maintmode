environment: dev

app:
  # Used by the auth OAuth callback/exchange to redirect back to the frontend.
  # Moved in from the auth config (RUK-194) — the merged process serves the auth
  # routes, so it needs this or those redirects target an empty URL.
  frontend_url: http://localhost:9000

auth:
  # OFF in the API-test stack: TestMain seeds the bootstrap admin and suites
  # request roles via the dev-only X-Test-Roles header, so open signup would
  # only mask the 403 signup_disabled path under test.
  allow_open_signup: false

jwtverifier:
  jwt_issuer: oauth-service
  # In-process JWKS: the merged maintmode process serves /.well-known/jwks.json
  # itself (RUK-194), so the verifier fetches from localhost, not the removed
  # auth service.
  jwks_url: http://localhost:8000/api/v1/.well-known/jwks.json
  jwks_refresh_interval: 1h
  jwks_http_timeout: 10s
  jwt_leeway: 30s
  jwks_unknown_kid_refresh_rate: 5m
  jwks_unknown_kid_wait_max: 10s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: debug

api_server:
  name: api
  host: 0.0.0.0
  port: 8000
  # Rate limiter for the auth login surface (/login/oauth), now served by the
  # merged process (RUK-194). The api e2e suite drives /login/oauth/* from one IP
  # and, via tloc-api's -count=2, twice — past the prod-shaped 30 RPM cap, which
  # surfaces as spurious 429s. This is the test-only config; raise the ceiling far
  # clear of the suite's burst.
  rate_limiter:
    requests_per_minute: 100000
    burst: 100000
    expires_in: 3m
    timeout: 200ms

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  collector_host: otel-collector
  collector_port: 4317

redis:
  addr: redis:6379
  password: <secret:redis/password>
  db: 0

oauth_providers:
  use_stub: true
  stub:
    redirect_url: http://localhost:9000/auth/api/v1/login/oauth/google/callback
  google:
    client_id: <secret:oauth/google/client_id>
    # client_secret is deprecated for production
    client_secret: <secret:oauth/google/client_secret>
    # redirect_url is deprecated for production
    redirect_url: http://localhost:9000/auth/api/v1/login/oauth/google/callback
    # google_userinfo_url is deprecated for production
    google_userinfo_url: https://www.googleapis.com/oauth2/v2/userinfo
    scopes:
      - "openid"
      - "email"
      - "profile"
    jwtverifier:
      jwks_url: https://www.googleapis.com/oauth2/v3/certs
      jwt_issuers:
        - "accounts.google.com"
        - "https://accounts.google.com"
      jwks_refresh_interval: 1h
      jwks_http_timeout: 10s
      jwt_leeway: 30s
      jwks_unknown_kid_refresh_rate: 5m
      jwks_unknown_kid_wait_max: 10s

jwt:
  issuer_name: oauth-service
  issuer_private_key: <secret:jwt/issuer_private_key>
  issuer_kid: <secret:jwt/issuer_kid>
  access_token_ttl: 15m
  refresh_token_ttl: 720h # 30 days
  refresh_token_grace_period: 1ms
  refresh_token_distributed_lock_ttl: 5s

notify_transport:
  # The channel catalog lives in Postgres (messenger_channels); tests
  # seed it via the storage layer. Per-transport credentials live in the
  # DB-backed integration registry (RUK-196). use_stub is OFF here on
  # purpose: every dispatch in the API suite traverses the LIVE resolver
  # (registry -> decrypt -> builder). No test enables an integration, so
  # a delivery resolves to disabled/unconfigured and drops best-effort —
  # the suite exercises the real DB-settings path without real transports.
  use_stub: false

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
  maint_auto_cancel:
    # 5-field cron: "minute hour day-of-month month day-of-week".
    # "* * * * *" = every minute (every value in every field).
    cron_spec: "* * * * *"
    threshold: 15m
    batch_limit: 100
  # audit_prune moved in with auth (RUK-194): the merged process owns the
  # audit-retention cron, so its spec must live here or NewTaskProcessors panics
  # building the cron job ("empty spec string").
  audit_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000
  invitation_rotate:
    cron_spec: "0 3 * * *"
    batch_limit: 1000
  invitation_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000

# crypto addresses the master key (KEK) that wraps the data-encryption keys
# protecting integration secrets at rest. A KEK is addressed by URI:
# local-kms://<id> is served from local_keys (URI -> hex-encoded 32-byte key);
# a cloud KMS would point active_kek_uri at the provider URI (gcp-kms://...,
# aws-kms://...) and wire that provider's KMSClient in bootstrap (the config
# contract itself does not change). Retired KEKs
# stay in local_keys so already-wrapped DEKs still unwrap during a rotation. The
# keyring fails fast on an empty/unsupported/weak KEK, so a bad value aborts startup.
crypto:
  active_kek_uri: local-kms://test-1
  local_keys:
    "local-kms://test-1": <secret:crypto/kek/test-1>
