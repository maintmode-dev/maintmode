environment: dev

app:
  # Used by the auth OAuth callback/exchange to redirect back to the frontend.
  # Moved in from the auth config — the merged process serves the auth
  # routes, so it needs this or those redirects target an empty URL.
  frontend_url: http://localhost:9000

auth:
  # OFF in the API-test stack: TestMain seeds the bootstrap admin and suites
  # request roles via the dev-only X-Test-Roles header, so open signup would
  # only mask the 403 signup_disabled path under test.
  allow_open_signup: false

jwtverifier:
  jwt_issuer: oauth-service
  # In-process JWKS: the merged maintmode process serves /.well-known/jwks.json
  # itself, so the verifier fetches from localhost, not the removed
  # auth service.
  jwks_url: http://localhost:8000/api/v1/.well-known/jwks.json
  jwks_refresh_interval: 1h
  jwks_http_timeout: 10s
  jwt_leeway: 30s
  jwks_unknown_kid_refresh_rate: 5m
  jwks_unknown_kid_wait_max: 10s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: debug

api_server:
  name: api
  host: 0.0.0.0
  port: 8000
  # Rate limiter for the auth login surface (/login/oauth), now served by the
  # merged process. The api e2e suite drives /login/oauth/* from one IP
  # and, via tloc-api's -count=2, twice — past the prod-shaped 30 RPM cap, which
  # surfaces as spurious 429s. This is the test-only config; raise the ceiling far
  # clear of the suite's burst.
  rate_limiter:
    requests_per_minute: 100000
    burst: 100000
    expires_in: 3m
    timeout: 200ms
  # Rate limiter for the /ui/v1 screen group, keyed by user id rather
  # than IP. Same reasoning as the block above, one step sharper: the api suite
  # drives the screen routes as a handful of users and, via tloc-api's -count=2,
  # twice over, so a prod-shaped 300 RPM cap would surface as spurious 429s.
  # This is the test-only config; the ceiling is out of the suite's way on
  # purpose. The limit itself is exercised by the unit and wiring tests in
  # internal/server, which do not depend on this file.
  ui_rate_limiter:
    requests_per_minute: 100000
    burst: 100000
    expires_in: 3m
    timeout: 200ms

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  collector_host: otel-collector
  collector_port: 4317

valkey:
  addr: valkey:6379
  password: <secret:valkey/password>
  db: 0

oauth_providers:
  use_stub: true
  google:
    client_id: <secret:oauth/google/client_id>
    jwtverifier:
      jwks_url: https://www.googleapis.com/oauth2/v3/certs
      jwt_issuers:
        - "accounts.google.com"
        - "https://accounts.google.com"
      jwks_refresh_interval: 1h
      jwks_http_timeout: 10s
      jwt_leeway: 30s
      jwks_unknown_kid_refresh_rate: 5m
      jwks_unknown_kid_wait_max: 10s

jwt:
  issuer_name: oauth-service
  issuer_private_key: <secret:jwt/issuer_private_key>
  issuer_kid: <secret:jwt/issuer_kid>
  access_token_ttl: 15m
  refresh_token_ttl: 720h # 30 days
  refresh_token_grace_period: 1ms
  refresh_token_distributed_lock_ttl: 5s

notify_transport:
  # The channel catalog lives in Postgres (messenger_channels); tests
  # seed it via the storage layer. Per-transport credentials live in the
  # DB-backed integration registry. use_stub is OFF here on
  # purpose: every dispatch in the API suite traverses the LIVE resolver
  # (registry -> decrypt -> builder). No test enables an integration, so
  # a delivery resolves to disabled/unconfigured and drops best-effort —
  # the suite exercises the real DB-settings path without real transports.
  use_stub: false

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
    # The API suite asserts on rows the outbox processors write after the
    # request returns (audit entries, invitation emails). goque's default 30s
    # poll made those assertions a race against where the publish landed in the
    # tick, and on a loaded shared database drain latency reached ~155s. Poll
    # fast here so the tests wait for the work, not for the ticker. Deployed
    # stands leave this unset and keep the 30s default.
    fetch_tick: 200ms
  maint_auto_cancel:
    # 5-field cron: "minute hour day-of-month month day-of-week".
    # "* * * * *" = every minute (every value in every field).
    cron_spec: "* * * * *"
    threshold: 15m
    batch_limit: 100
  # audit_prune moved in with auth: the merged process owns the
  # audit-retention cron, so its spec must live here or NewTaskProcessors panics
  # building the cron job ("empty spec string").
  audit_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000
  invitation_rotate:
    cron_spec: "0 3 * * *"
    batch_limit: 1000
  invitation_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000

# crypto addresses the master key (KEK) that wraps the data-encryption keys
# protecting integration secrets at rest. A KEK is addressed by URI:
# local-kms://<id> is served from local_keys (URI -> hex-encoded 32-byte key);
# a cloud KMS would point active_kek_uri at the provider URI (gcp-kms://...,
# aws-kms://...) and wire that provider's KMSClient in bootstrap (the config
# contract itself does not change). Retired KEKs
# stay in local_keys so already-wrapped DEKs still unwrap during a rotation. The
# keyring fails fast on an empty/unsupported/weak KEK, so a bad value aborts startup.
crypto:
  active_kek_uri: local-kms://test-1
  local_keys:
    "local-kms://test-1": <secret:crypto/kek/test-1>

# Break-glass admin sign-in (POST /api/v1/login/password).
#
# The password is a secret and lives in app.secrets.yaml under
# "bootstrap/password", alongside every other credential — not inline here, and
# with no environment-variable override: an env var is readable by anything that
# can inspect the process or the compose file.
#
# An EMPTY secret is valid and supported: the app then generates a random
# password at startup and logs it once at WARN. The key itself must exist in the
# secrets file even when empty — the resolver hard-fails on a missing key, so a
# deployment whose secrets predate this key will not start until it is added.
#
# A generated password is valid for ONE replica only: with
# `docker compose up --scale maintmode=N` each replica generates its own, so a
# scaled deployment must set a real value.
bootstrap:
  email: admin@example.com
  password: <secret:bootstrap/password>
