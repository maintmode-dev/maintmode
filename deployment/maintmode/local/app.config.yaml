environment: local

app:
  # Used by the auth OAuth callback/exchange to redirect back to the frontend.
  # Moved in from the auth config (RUK-194) — the merged process serves the auth
  # routes, so it needs this or those redirects target an empty URL.
  frontend_url: http://localhost:9000

jwtverifier:
  jwt_issuer: oauth-service
  # In-process JWKS: the merged maintmode process serves /.well-known/jwks.json
  # itself (RUK-194), so the verifier fetches from localhost, not via the auth
  # upstream.
  jwks_url: http://localhost:8000/api/v1/.well-known/jwks.json
  jwks_refresh_interval: 1h
  jwks_http_timeout: 10s
  jwt_leeway: 30s
  jwks_unknown_kid_refresh_rate: 5m
  jwks_unknown_kid_wait_max: 10s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: info

api_server:
  name: api
  host: 0.0.0.0
  port: 8000
  # Rate limiter for the auth login surface (/login/oauth), now served by the
  # merged process (RUK-194). Moved in from the auth config — without it the
  # login/oauth endpoints lose their per-IP cap.
  rate_limiter:
    requests_per_minute: 30
    burst: 30
    expires_in: 3m
    timeout: 200ms

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  collector_host: localhost
  collector_port: 4317

redis:
  addr: localhost:6379
  password: <secret:redis/password>
  db: 0

oauth_providers:
  use_stub: false
  stub:
    redirect_url: http://localhost:9000/auth/api/v1/login/oauth/google/callback
  google:
    client_id: <secret:oauth/google/client_id>
    # client_secret is deprecated for production
    client_secret: <secret:oauth/google/client_secret>
    # redirect_url is deprecated for production
    redirect_url: http://localhost:9000/auth/api/v1/login/oauth/google/callback
    # google_userinfo_url is deprecated for production
    google_userinfo_url: https://www.googleapis.com/oauth2/v2/userinfo
    scopes:
      - "openid"
      - "email"
      - "profile"
    jwtverifier:
      jwks_url: https://www.googleapis.com/oauth2/v3/certs
      jwt_issuers:
        - "accounts.google.com"
        - "https://accounts.google.com"
      jwks_refresh_interval: 1h
      jwks_http_timeout: 10s
      jwt_leeway: 30s
      jwks_unknown_kid_refresh_rate: 5m
      jwks_unknown_kid_wait_max: 10s

jwt:
  issuer_name: oauth-service
  issuer_private_key: <secret:jwt/issuer_private_key>
  issuer_kid: <secret:jwt/issuer_kid>
  access_token_ttl: 15m
  refresh_token_ttl: 720h # 30 days
  refresh_token_grace_period: 1ms
  refresh_token_distributed_lock_ttl: 5s
  oauth_state_signing_key: <secret:jwt/oauth_state_signing_key>
  oauth_state_ttl: 5m

notify_transport:
  # use_stub=true (dev only) routes all deliveries to the in-memory
  # stub messenger. This lets a developer watch deliveries in app logs
  # without real Slack/Telegram tokens. The channel catalog lives in
  # Postgres (messenger_channels) — create channels via
  # POST /api/v1/notifications/channels, not via this config.
  use_stub: true
  slack:
    enabled: false
    bot_token: <secret:messengers/slack/bot_token>
    # api_url overrides the default Slack API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s
  telegram:
    enabled: false
    bot_token: <secret:messengers/telegram/bot_token>
    # api_url overrides the default Telegram Bot API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s
  email:
    # SMTP delivery for invitation emails. Disabled in dev — use_stub above
    # routes deliveries to the in-memory stub so no real mail server is needed.
    enabled: false
    host: ""
    port: 587
    username: ""
    password: <secret:messengers/email/password>
    from: "noreply@maintmode.local"
    reply_to: ""
    # tls_policy: "mandatory" (default) | "opportunistic" | "none".
    # "none" + empty username is the integration-test mode against an in-process
    # SMTP server (the SMTP analogue of the slack/telegram api_url override).
    tls_policy: "mandatory"
    timeout: 10s

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
  maint_auto_cancel:
    # 5-field cron: "minute hour day-of-month month day-of-week".
    # "* * * * *" = every minute (every value in every field).
    cron_spec: "* * * * *"
    threshold: 15m
    batch_limit: 100
  # audit_prune moved in with auth (RUK-194): the merged process owns the
  # audit-retention cron, so its spec must live here or NewTaskProcessors panics
  # building the cron job ("empty spec string").
  audit_prune:
    cron_spec: "0 3 * * *"
    retention: 8760h
    batch_limit: 1000
