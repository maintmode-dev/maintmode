environment: local

app:

jwtverifier:
  jwt_issuer: oauth-service
  jwks_url: http://localhost:9000/auth/api/v1/.well-known/jwks.json
  jwks_refresh_interval: 1h
  jwks_http_timeout: 10s
  jwt_leeway: 30s
  jwks_unknown_kid_refresh_rate: 5m
  jwks_unknown_kid_wait_max: 10s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: info

api_server:
  name: api
  host: 0.0.0.0
  port: 8000

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  collector_host: localhost
  collector_port: 4317

redis:
  addr: localhost:6379
  password: <secret:redis/password>
  db: 0

external_services:
  auth:
    secret: <secret:external_services/auth/secret>
    protocol: http
    host: auth
    port: 8000
    timeout: 3s

s2s:

notify_transport:
  # use_stub=true (dev only) routes all deliveries to the in-memory
  # stub messenger. This lets a developer watch deliveries in app logs
  # without real Slack/Telegram tokens. The channel catalog lives in
  # Postgres (messenger_channels) — create channels via
  # POST /api/v1/notifications/channels, not via this config.
  use_stub: true
  slack:
    enabled: false
    bot_token: <secret:messengers/slack/bot_token>
    # api_url overrides the default Slack API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s
  telegram:
    enabled: false
    bot_token: <secret:messengers/telegram/bot_token>
    # api_url overrides the default Telegram Bot API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s
  email:
    # SMTP delivery for invitation emails. Disabled in dev — use_stub above
    # routes deliveries to the in-memory stub so no real mail server is needed.
    enabled: false
    host: ""
    port: 587
    username: ""
    password: <secret:messengers/email/password>
    from: "noreply@maintmode.local"
    reply_to: ""
    # tls_policy: "mandatory" (default) | "opportunistic" | "none".
    # "none" + empty username is the integration-test mode against an in-process
    # SMTP server (the SMTP analogue of the slack/telegram api_url override).
    tls_policy: "mandatory"
    timeout: 10s

task_processor:
  messaging:
    workers: 10
    max_attempts: 5
