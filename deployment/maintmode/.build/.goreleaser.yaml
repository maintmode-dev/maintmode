# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

project_name: maintmode

builds:
  - id: "main"
    env:
      - GOAMD64=""
      - CGO_ENABLED=0
    no_unique_dist_dir: true
    main: ./cmd/maintmode
    # dist/<os>/<arch>/maintmode. The CI image build mounts dist/linux as the
    # binary source and lets buildx pick the architecture directory, so the
    # layout has to be predictable — {{ .Target }} is not: it carries a
    # microarchitecture suffix that differs per GOARCH (amd64_v1, arm64_v8.0).
    # `make build` passes --output explicitly, so it is unaffected.
    binary: "{{ .Os }}/{{ .Arch }}/{{ .ProjectName }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # version/commit/date come straight from git — goreleaser now runs where
      # git is available (the CI build-maintmode job and local `make build`),
      # not inside Docker, so no env-var workaround is needed.
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.version={{.Version}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.os={{.Os}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.arch={{.Arch}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.buildTime={{.Date}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.shaCommit={{.FullCommit}}
  - id: dev
    env:
      - GOAMD64=""
      - CGO_ENABLED=0
    no_unique_dist_dir: true
    main: ./cmd/maintmode
    binary: "dev_{{ .ProjectName }}_{{ .Target }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.version={{.Version}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.os={{.Os}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.arch={{.Arch}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.buildTime={{.Date}}
      - -X github.com/ruko1202/maintmode/internal/config/buildmeta.shaCommit={{.FullCommit}}
    gcflags:
      - all=-N -l


archives:
  - formats: [ binary ]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  # Allows you to change the name of the generated snapshot
  #
  # Note that some pipes require this to be semantic version compliant (nfpm,
  # for example).
  #
  # Default: `{{ .Version }}-SNAPSHOT-{{.ShortCommit}}`.
  # Templates: allowed.
  version_template: "{{ .Tag }}-{{ .ShortCommit }}"
