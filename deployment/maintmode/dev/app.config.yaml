environment: dev

app:

jwtverifier:
  jwt_issuer: oauth-service
  jwks_url: http://auth:8000/api/v1/.well-known/jwks.json
  jwks_refresh_interval: 1h
  jwks_http_timeout: 10s
  jwt_leeway: 30s
  jwks_unknown_kid_refresh_rate: 5m
  jwks_unknown_kid_wait_max: 10s

rbac:
  adapter: file
  # Files live in <APP>_AUTHZ_DIR (env). Override "memory" only in tests.
  model: model.conf
  policy: policy.csv

logger:
  level: debug

api_server:
  name: api
  host: 0.0.0.0
  port: 8000

infra_server:
  name: status
  host: 0.0.0.0
  port: 8001

db:
  dsn: <secret:db/dsn>
  driver: postgres
  max_open_conns: 50
  max_idle_conns: 20
  connection_max_lifetime: 10m
  connection_max_idle_time: 5m

tracer:
  collector_host: otel-collector
  collector_port: 4317

redis:
  addr: redis:6379
  password: <secret:redis/password>
  db: 0

external_services:
  auth:
    secret: <secret:external_services/auth/secret>
    protocol: http
    host: auth
    port: 8000
    timeout: 3s

s2s:

messengers:
  use_stub: false
  slack:
    enabled: false
    bot_token: <secret:messengers/slack/bot_token>
    # api_url overrides the default Slack API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s
  telegram:
    enabled: false
    bot_token: <secret:messengers/telegram/bot_token>
    # api_url overrides the default Telegram Bot API base URL.
    # Leave empty in production;
    # set for integration tests, corporate proxies, or a self-hosted telegram-bot-api server.
    api_url: ""
    timeout: 10s

task_processor:
  messaging:
    workers: 10
    max_attempts: 5

maint_notify:
  routes:
    - { event: maint.started,   transport: slack, target: "#maint-test" }
    - { event: maint.completed, transport: slack, target: "#maint-test" }
    - { event: maint.cancelled, transport: slack, target: "#maint-test" }
    - { event: step.started,    transport: slack, target: "#maint-test" }
    - { event: step.completed,  transport: slack, target: "#maint-test" }
    - { event: step.cancelled,  transport: slack, target: "#maint-test" }
