# maintmode — dev secrets (sample).
#
# Restore a working file with:
#   cp deployment/maintmode/dev/app.secrets.sample.yaml \
#      deployment/maintmode/dev/app.secrets.yaml
#
# app.secrets.yaml is gitignored in every environment. Everything below is a
# throwaway value for the containerized compose stack and can be used as-is —
# except the OAuth client_id, which you must fill in from the Google Cloud
# console (see the note on that key).
#
# THREAT MODEL: dev/local/test are explicitly OUT of the at-rest threat model.
# Nothing here protects anything real. Never put a live credential in this file
# — it is the sample, and samples get committed.

# Connect through pg_doorman (the pooler), not postgres directly.
db/dsn: "postgres://postgres:postgres@pg_doorman:6432/maintmode?sslmode=disable"
valkey/password: ""

# Google OAuth — client_id ONLY.
#
# Until RUK-291 there was deliberately no client_secret here: the BFF
# (maintmode-ui, NextAuth) owned the authorization-code exchange and the backend
# only verified the resulting id_token offline against Google's JWKS.
#
# RUK-291 made the backend a confidential OAuth client, so a client_secret is now
# meaningful — but ONLY for the backend-driven dance, which is OFF unless
# app.config.yaml also sets oauth_providers.oidc.google.client_secret and
# redirect_uri. The BFF path still needs nothing but the client_id.
#
# ORDER MATTERS. The secret resolver hard-fails on a missing key, so a
# <secret:...> reference in app.config.yaml without the matching entry below
# stops the instance booting. Add the key here FIRST, then the config reference.
# Note `make secrets` only copies this sample when app.secrets.yaml is ABSENT —
# on a machine that already has one, add the key by hand or the next run dies at
# config load.
#
# The client_id is not a secret (it ships in every browser redirect), but it
# must match the client the BFF uses or every token fails audience validation.
# Copy it from the Google Cloud console, or from the BFF's
# MAINTMODE_GOOGLE_OAUTH_CLIENT_ID.
"oauth/google/client_id": "CHANGE_ME.apps.googleusercontent.com"

# Backend-driven OAuth dance (RUK-291). Leave as-is unless
# app.config.yaml opts in; the routes stay unregistered without it.
"oauth/google/client_secret": "CHANGE_ME-google-client-secret"

# JWT signing — the merged binary mints and verifies its own tokens.
#   issuer_private_key      hex-encoded raw P-256 private key
#   issuer_kid              key id advertised in the in-process JWKS
#
# Fixed dev values so a fresh bring-up works out of the box. Regenerate with:
#   go run ./scripts/keygen        # prints the raw scalar, kid and public key
# The value is a hex-encoded RAW P-256 scalar (32 bytes), not DER: config
# hex-decodes it and calls ecdsa.ParseRawPrivateKey.
"jwt/issuer_private_key": "1be2f1f68285c972b750b7718b00d5453f2c08f88c7894d1b9013f75a439de20"
"jwt/issuer_kid": "99d1e557df9b619fd046322c1e7f196e"

# KEK for integration-secret envelope encryption (32-byte hex).
#
# Throwaway sample key for a working local stack, exactly like the dev JWT key
# above. It protects NOTHING real — never store a live integration secret in a
# dev DB. In prod the KEK is a `<secret:...>` ref resolved from the secret
# store (see prod/app.secrets.sample.yaml), never git.
# Regenerate with: openssl rand -hex 32
"crypto/kek/dev-1": "ff504a4da27bcff6bc97794401dd2219826cd0a649736409ecffbde5ccbaaa70"

# Break-glass admin password (POST /api/v1/login/password).
#
# Empty is a valid, supported value: the app then generates a random password at
# startup and logs it once at WARN. Fill it in to pin a stable credential.
"bootstrap/password": ""
