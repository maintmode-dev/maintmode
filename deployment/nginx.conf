# Reverse proxy for local development.
# All traffic goes through localhost:3000 (single origin),
# so cookies and CORS work without hacks.
#
# Usage:
#   docker compose up        (runs nginx in container)
#   go run ./cmd/demo        (runs backend + static on host)
#
# Open http://localhost:3000 in a browser.

error_log /dev/stderr;
pid       /tmp/nginx-demo.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stderr;

    server {
        listen 3000;
        server_name api;

        # API and auth endpoints → backend
        location /auth/ {
            proxy_pass http://auth:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # API and maintmode endpoints → backend
        location /maintmode/ {
            proxy_pass http://maintmode:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Папка, где лежит ваш единственный index.html
        root /var/www/html/publicapi;
        # Знак "=" означает строгое совпадение с адресом "/"
        location = / {
            try_files /index.html =404;
        }
    }

    server {
        listen 3001;
        server_name infra;

        # API and auth endpoints → backend
        location /auth/ {
            proxy_pass http://auth:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # API and maintmode endpoints → backend
        location /maintmode/ {
            proxy_pass http://maintmode:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Папка, где лежит ваш единственный index.html
        root /var/www/html/infra;
        # Знак "=" означает строгое совпадение с адресом "/"
        location = / {
            try_files /index.html =404;
        }
    }
}