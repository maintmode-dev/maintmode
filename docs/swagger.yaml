host: localhost:8000
info:
  contact:
    email: platform@example.com
    name: Platform Team
  description: |-
    API for planning and executing maintenance windows.

    Core idea: overlapping time + shared resources = risk.
  license:
    name: Proprietary
  termsOfService: https://example.com/terms
  title: Maintenance Calendar API
  version: 1.0.0
paths:
  /api/v1/.well-known/jwks.json:
    get:
      description: Returns JSON Web Key Set used to verify access tokens.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiauthmodels.JWKSResponse'
      summary: Get JWKS
      tags:
      - Auth
  /api/v1/audit/log:
    get:
      description: 'Returns the last N audit log entries (default and max: 100).'
      parameters:
      - default: 100
        description: Number of entries to return (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiauthmodels.AuditLogResponse'
        "400":
          description: Invalid limit parameter
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get audit log
      tags:
      - Audit
  /api/v1/login/oauth/google:
    get:
      description: |-
        Redirects the user to the OAuth provider consent page.

        The handler issues a short-lived nonce cookie and a signed state
        that carries `original_uri` and the desired callback response
        shape (`oauth_callback_type`). Both values are echoed back by
        the provider to `/login/oauth/google/callback`.

        Query parameters:
        - `original_uri` — frontend path to navigate to after login (preserved through the OAuth flow).
        - `oauth_callback_type` — selects the callback response shape:
        - `json` *(default)* — callback returns `OAuthCallbackJSONResponse` with tokens in the body. Use this for production server-side integrations (BFF / NextAuth).
        - `html` — callback returns a legacy HTML handoff page and sets an HttpOnly refresh cookie. Intended for local testing / the prototype frontend.
      parameters:
      - description: Original frontend path to redirect after login
        in: query
        name: original_uri
        type: string
      - description: 'Callback response shape: `json` (default, server-side BFF) or
          `html` (legacy handoff for local testing)'
        enum:
        - json
        - html
        in: query
        name: oauth_callback_type
        type: string
      produces:
      - text/plain
      responses:
        "307":
          description: Temporary redirect to OAuth provider
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
      summary: Start OAuth login
      tags:
      - Auth
  /api/v1/login/oauth/google/callback:
    get:
      description: |-
        Handles the redirect from Google after the user grants consent.
        Validates the signed `state` and the nonce cookie, exchanges the
        authorization `code` for tokens, and returns the result.

        **Default response — JSON**
        Returns `OAuthCallbackJSONResponse` with the access token, refresh
        token, and `original_uri` in the response body. The refresh token
        is **not** set as a cookie — the caller (typically a server-side
        BFF) persists it in its own session storage. This is the contract
        used by production server-side integrations (NextAuth, BFFs) that
        must never expose tokens to the browser.

        JSON mode is selected when **any** of the following holds:
        - `Accept: application/json` request header
        - `Content-Type: application/json` request header
        - the signed state was issued with `oauth_callback_type=json`
        (see `/login/oauth/google?oauth_callback_type=json`, which is
        also the default if the parameter is omitted)

        **HTML mode (legacy / local testing)** — opt-in via the login
        handler with `?oauth_callback_type=html`. In this mode the
        handler sets an HttpOnly, Secure, SameSite=Strict refresh-token
        cookie on the backend domain and returns an HTML handoff page
        that stashes the access token in `sessionStorage` and redirects
        to `frontendURL + original_uri`. Kept for the prototype frontend
        and local debugging only — production clients should not use it.

        Both modes clear the nonce cookie on success.
      parameters:
      - description: 'Optional override: `application/json` forces JSON mode regardless
          of the state flag (JSON is already the default).'
        in: header
        name: Accept
        type: string
      - description: OAuth authorization code returned by the provider
        in: query
        name: code
        required: true
        type: string
      - description: Signed opaque state (HMAC + expiry) issued by /login/oauth/google;
          carries the HTML/JSON mode flag set at login time
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: 'Opt-in HTML mode: handoff page that stores access_token in
            sessionStorage and redirects; refresh cookie set'
          headers:
            Set-Cookie:
              description: Refresh token cookie (HTML mode only; not set in JSON mode)
              type: string
          schema:
            type: string
        "400":
          description: Missing/invalid/expired/tampered state or nonce mismatch
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
      summary: OAuth callback (JSON by default, HTML opt-in)
      tags:
      - Auth
  /api/v1/logout:
    post:
      consumes:
      - application/json
      description: Revokes current refresh token, blacklists access token, and clears
        refresh cookie.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        type: string
      - description: Fallback refresh token body when cookie is absent
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.refreshTokenJSONRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Cleared refresh token cookie
              type: string
        "400":
          description: Invalid token
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
      summary: Logout current session
      tags:
      - Auth
  /api/v1/logout/all:
    post:
      description: Revokes all refresh tokens for current user and clears refresh
        cookie.
      parameters:
      - description: Bearer access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Logged out from all sessions
          headers:
            Set-Cookie:
              description: Cleared refresh token cookie
              type: string
        "400":
          description: Invalid token
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
      summary: Logout from all sessions
      tags:
      - Auth
  /api/v1/maintenances/{id}:
    get:
      consumes:
      - application/json
      description: Returns a maintenance entity by its unique identifier.
      parameters:
      - description: Maintenance ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
