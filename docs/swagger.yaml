        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "404":
          description: Maintenance not found
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "503":
          description: Auth service unavailable
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
      security:
