  /api/v1/maintenances/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approves a maintenance draft by ID using an observed revision and
        conflict snapshot.
      parameters:
      - description: Maintenance ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Approve maintenance request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apimodels.ApproveDraftMaintRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Maintenance approved
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "404":
          description: Maintenance not found
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "409":
          description: Forbidden status transition or conflicts changed since preview
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
        "503":
          description: Auth service unavailable
          schema:
            $ref: '#/definitions/httperrors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve maintenance draft
      tags:
      - Maintenances
