                deferred_notifications is tri-state and the states cannot be expressed
                in the schema below: omitting the field or sending null leaves the
                existing reminders untouched, sending an empty array clears them all,
                and sending a non-empty array replaces them.

                mentions is tri-state on the same rule: omitting the field or sending
                null leaves the tagged users untouched, sending an empty array clears
                them all, and sending a non-empty array replaces them. At most 10.
            parameters:
                - description: Maintenance ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
