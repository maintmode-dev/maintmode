                Malformed pagination/filter params are coerced to defaults rather than rejected.
                has_messenger_tag is always present. It reports only WHETHER the user has any messenger handle configured, never which one or its value, and it is meaningful only for callers permitted to plan maintenances (editor and above) — for anyone below it is hard false on every row.
            parameters:
                - description: Case-insensitive partial match on display_name or email. The telegram_tag and slack_tag columns are NOT matched here — this response never carries their values (only the derived has_messenger_tag boolean), and matching them would let any caller confirm which tag belongs to which person. Tag search lives on the admin user list.
