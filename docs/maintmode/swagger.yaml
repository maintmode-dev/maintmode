        get:
            description: |-
                Returns draft maintenances where the caller is the assigned approver,
                oldest first. The approver is taken from the access token — there is no
                parameter to request another user's queue.
                Malformed pagination params are coerced to defaults rather than rejected.
            parameters:
                - description: Page size; values <= 0 or above 200 fall back to 50, not to 200
                  in: query
                  name: limit
                  schema:
                    default: 50
                    type: integer
                - description: Pagination offset; negative values fall back to 0
                  in: query
                  name: offset
                  schema:
                    default: 0
                    type: integer
            responses:
                "200":
