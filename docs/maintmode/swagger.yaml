                    description: Internal error
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/httperrors.ErrorResponse'
                    description: Auth service unavailable
            security:
                - BearerAuth: []
            summary: List assignable users
            tags:
                - Maintenances
