name: Secret scan

# Deliberately its own workflow with NO `paths:` filter.
#
# This lived in backend-ci.yml first, which filters to cmd/**, internal/**,
# deployment/** and friends — so a PR touching only scripts/, monitoring/, a
# root dotfile or a new top-level directory would run no scan at all. A secret
# scanner that skips files is worse than none, because it reads as coverage.
on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans only what the event ADDS — the PR's commit range, or the pushed
      # commits — not full history.
      #
      # History still contains the dev/local/test Google client secrets that
      # were committed before deployment/**/app.secrets.yaml was gitignored.
      # They are rotated, not erased: scrubbing them would rewrite every
      # published commit. A full-history scan would therefore fail forever and
      # train everyone to ignore this job. New commits are what we can keep
      # clean, so that is what this gates.
      - name: Scan commits introduced by this event
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

          BEFORE="${{ github.event.before }}"

          # Default: the pushed tip only. Used for the first push to a branch
          # (`before` is the all-zero sha) and for a force-push, which leaves
          # `before` pointing at an orphaned commit whose range resolves oddly
          # or empty. Tolerated: the PR scan already gated that content, and the
          # alternative is scanning all of history, which cannot pass.
          RANGE="${{ github.sha }}~1..${{ github.sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif git rev-parse --quiet --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            RANGE="$BEFORE..${{ github.sha }}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "::warning::$BEFORE is unreachable (force-push?); scanning the tip commit only"
          fi
          echo "scanning $RANGE"

          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --log-opts="$RANGE"
