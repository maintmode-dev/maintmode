name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "cmd/**"
      - "deployment/**"
      - "docs/**"
      - "internal/**"
      - "migrations/**"
      - "test/**"
      - "compose*.yaml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

env:
  DOCKER_COMPOSE_APP_CONFIGS: -f compose.yaml -f compose.app.test.yaml -f compose.app.ci.yaml
  # CI runs without the monitoring profile to keep test runs lean.
  # See Makefile (COMPOSE_PROFILES_FLAGS) for the local/prod default.
  COMPOSE_PROFILES_FLAGS: --profile storages --profile app
  MAINTMODE_IMAGE_TAG: ${{ github.sha }}
  CADDY_IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: -v --build-tags=api ./...
          cache-invalidation-interval: 3

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Version matches bin-deps in the Makefile; GOBIN points at ./bin, which
      # is where the vuln target looks for the binary. The go.mod toolchain
      # directive pins the stdlib the scan runs against.
      - name: Install govulncheck
        run: GOBIN=$PWD/bin go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - run: make vuln

  build-maintmode:
    name: Build binary (maintmode)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so goreleaser sees tags/history and stamps the real
      # version + commit into the binary (this is the ONLY place the binary is
      # built — the image job reuses this artifact instead of rebuilding).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p tmp/bin
      # Both Linux architectures, not --single-target. The image is published
      # for amd64 and arm64 (a self-hosted operator on an ARM Mac cannot pull
      # an amd64-only image), and each one needs its own binary — Docker can
      # emulate a foreign architecture, but it cannot make an amd64 binary run
      # on arm64. Cross-compiling here is cheap: CGO is off, so it is two `go
      # build` invocations rather than an emulated toolchain.
      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: v2.13.1
          args: build -f deployment/maintmode/.build/.goreleaser.yaml --snapshot --clean --id main
      # Hand the built binaries to image-maintmode so it doesn't rebuild them in
      # Docker. Only needed on image-building runs (main/tag), but uploading on
      # PRs too is cheap and keeps the job identical.
      # Stage the two binaries under a directory of their own before uploading.
      # upload-artifact derives the archive root from the least common ancestor
      # of what it matches, so uploading `dist/linux` directly makes the entries
      # depend on what else goreleaser happened to leave in that tree. Staging
      # makes the archive contents exactly <arch>/maintmode, which is what
      # image-maintmode unpacks into tmp/bin for the Dockerfile's TARGETARCH
      # lookup. `cp` also fails loudly here if a build did not produce one.
      - name: Stage the linux binaries for the image job
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "tmp/bin/$arch"
            cp "dist/linux/$arch/maintmode" "tmp/bin/$arch/maintmode"
          done
          find tmp/bin -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: maintmode-binary
          path: tmp/bin
          retention-days: 1
          if-no-files-found: error

  test:
    name: Backend tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install docker-compose shim
        run: |
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'EOF'
          #!/usr/bin/env bash
          docker compose "$@"
          EOF
          sudo chmod +x /usr/local/bin/docker-compose
      - run: make docker-up
      # tloc-cov, not tloc: it is the only target running with -race, so the
      # concurrency tests (xcache generations, cipher parallel use) actually
      # exercise the race detector in CI.
      - run: make tloc-cov
      - run: make docker-down
        if: always()

  image-maintmode:
    name: Build image (maintmode)
    runs-on: ubuntu-latest
    # Image build/publish + e2e run only on main/tag pushes, not on PRs.
    # Feature-branch PRs run just lint + build + unit tests (the jobs above).
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - vuln
      - test
      - build-maintmode
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Reuse the binary from build-maintmode (already stamped with the real
      # version + commit) instead of rebuilding it in Docker. Lands at
      # tmp/bin/maintmode, which the Dockerfile's `ci` target COPYs in.
      - uses: actions/download-artifact@v4
        with:
          name: maintmode-binary
          path: tmp/bin
      # The Dockerfile reads tmp/bin/<arch>/maintmode. Assert that rather than
      # letting a layout change surface 40 lines later as an opaque buildx
      # "failed to calculate checksum ... not found", which is what a mismatch
      # here looked like the first time.
      - name: Check the binaries arrived per architecture
        run: |
          set -euo pipefail
          echo "--- unpacked artifact ---"
          find tmp/bin -type f | sort
          for arch in amd64 arm64; do
            [ -f "tmp/bin/$arch/maintmode" ] || {
              echo "::error::tmp/bin/$arch/maintmode missing — see the listing above"
              exit 1
            }
          done
      # Registers binfmt handlers so buildx can run the arm64 stages on an
      # amd64 runner. Without it a multi-platform build fails on the first RUN.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/maintmode
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      # Push straight to GHCR. api-test pulls the sha-tagged image from there,
      # so no tar artifact is saved (avoids the Actions artifact storage quota).
      # target: ci → runtime-only image that copies the prebuilt binary; the
      # Go builder stages are skipped entirely.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/maintmode/.build/Dockerfile
          target: ci
          # The `ci` target picks tmp/bin/$TARGETARCH/maintmode, so each
          # platform gets the binary built for it in build-maintmode.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=maintmode
          cache-to: type=gha,mode=max,scope=maintmode

  image-migrations:
    name: Build image (migrations)
    runs-on: ubuntu-latest
    # Same gate as the app images: publish only on main/tag pushes, not PRs.
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - vuln
      - test
      - build-maintmode
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Registers binfmt handlers so buildx can run the arm64 stages on an
      # amd64 runner. Without it a multi-platform build fails on the first RUN.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/maintmode-migrations
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      # The migrations image is tiny (goose base + *.sql), no app source build,
      # and no e2e consumer — so push directly rather than load+save+tar like
      # the app images do.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/migrations/Dockerfile
          # Built for both architectures: a self-hosted operator on an ARM Mac
          # cannot pull an amd64-only image, and this one is just SQL copied
          # onto a base image that already ships both.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  api-test:
    name: API e2e tests
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    needs:
      - image-maintmode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pull the just-published images from GHCR and retag to the local CI tag
      # that compose.app.ci.yaml references. (Replaces the old tar artifact
      # hand-off, which hit the Actions artifact storage quota.)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull + retag app images from GHCR
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          docker pull "ghcr.io/${{ github.repository_owner }}/maintmode:${SHA_TAG}"
          docker tag "ghcr.io/${{ github.repository_owner }}/maintmode:${SHA_TAG}" "maintmode-ci-maintmode:${{ github.sha }}"
      - uses: docker/setup-buildx-action@v3
      - name: Build custom Caddy image (xcaddy + ratelimit)
        # Prebuild with a persistent GHA layer cache so the slow xcaddy
        # compile runs only when deployment/caddy/Dockerfile changes. The
        # tag matches compose.app.ci.yaml so `make app-up` reuses it instead
        # of rebuilding Caddy from scratch on every run.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/caddy/Dockerfile
          load: true
          push: false
          tags: maintmode-ci-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Install docker-compose shim
        run: |
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'EOF'
          #!/usr/bin/env bash
          docker compose "$@"
          EOF
          sudo chmod +x /usr/local/bin/docker-compose
      # `app-up` depends on the `secrets` target, which restores the git-ignored
      # test app.secrets.yaml from its committed sample. The test env runs the
      # stub OAuth provider against a compose-local Postgres, so the sample's
      # throwaway values are exactly what the e2e stack needs.
      - run: make app-up
      - run: make tloc-api
      - run: make app-down
        if: always()
