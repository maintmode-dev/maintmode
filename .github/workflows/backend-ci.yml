name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "cmd/**"
      - "deployment/**"
      - "docs/**"
      - "internal/**"
      - "migrations/**"
      - "test/**"
      - "compose*.yaml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

env:
  DOCKER_COMPOSE_APP_CONFIGS: -f compose.yaml -f compose.app.test.yaml -f compose.app.ci.yaml
  # CI runs without the monitoring profile to keep test runs lean.
  # See Makefile (COMPOSE_PROFILES_FLAGS) for the local/prod default.
  COMPOSE_PROFILES_FLAGS: --profile storages --profile app
  MAINTMODE_IMAGE_TAG: ${{ github.sha }}
  AUTH_IMAGE_TAG: ${{ github.sha }}
  CADDY_IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: -v --build-tags=api ./...
          cache-invalidation-interval: 3

  build-maintmode:
    name: Build binary (maintmode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p tmp/bin
      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: v2.13.1
          args: build -f deployment/maintmode/.build/.goreleaser.yaml --snapshot --single-target --clean --id main --output=./tmp/bin/maintmode

  build-auth:
    name: Build binary (auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p tmp/bin
      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: v2.13.1
          args: build -f deployment/auth/.build/.goreleaser.yaml --snapshot --single-target --clean --id main --output=./tmp/bin/auth

  test:
    name: Backend tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install docker-compose shim
        run: |
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'EOF'
          #!/usr/bin/env bash
          docker compose "$@"
          EOF
          sudo chmod +x /usr/local/bin/docker-compose
      - run: make docker-up
      - run: make tloc
      - run: make docker-down
        if: always()

  image-maintmode:
    name: Build image (maintmode)
    runs-on: ubuntu-latest
    # Image build/publish + e2e run only on main/tag pushes, not on PRs.
    # Feature-branch PRs run just lint + build + unit tests (the jobs above).
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
      - build-maintmode
      - build-auth
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/maintmode
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      # Push straight to GHCR. api-test pulls the sha-tagged image from there,
      # so no tar artifact is saved (avoids the Actions artifact storage quota).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/maintmode/.build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=maintmode
          cache-to: type=gha,mode=max,scope=maintmode

  image-auth:
    name: Build image (auth)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
      - build-maintmode
      - build-auth
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/auth
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      # Push straight to GHCR (no tar artifact — see image-maintmode).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/auth/.build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

  image-migrations:
    name: Build image (migrations)
    runs-on: ubuntu-latest
    # Same gate as the app images: publish only on main/tag pushes, not PRs.
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
      - build-maintmode
      - build-auth
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/migrations
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      # The migrations image is tiny (goose base + *.sql), no app source build,
      # and no e2e consumer — so push directly rather than load+save+tar like
      # the app images do.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/migrations/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  api-test:
    name: API e2e tests
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    needs:
      - image-maintmode
      - image-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pull the just-published images from GHCR and retag to the local CI tag
      # that compose.app.ci.yaml references. (Replaces the old tar artifact
      # hand-off, which hit the Actions artifact storage quota.)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull + retag app images from GHCR
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          docker pull "ghcr.io/${{ github.repository }}/maintmode:${SHA_TAG}"
          docker pull "ghcr.io/${{ github.repository }}/auth:${SHA_TAG}"
          docker tag "ghcr.io/${{ github.repository }}/maintmode:${SHA_TAG}" "maintmode-ci-maintmode:${{ github.sha }}"
          docker tag "ghcr.io/${{ github.repository }}/auth:${SHA_TAG}" "maintmode-ci-auth:${{ github.sha }}"
      - uses: docker/setup-buildx-action@v3
      - name: Build custom Caddy image (xcaddy + ratelimit)
        # Prebuild with a persistent GHA layer cache so the slow xcaddy
        # compile runs only when deployment/caddy/Dockerfile changes. The
        # tag matches compose.app.ci.yaml so `make app-up` reuses it instead
        # of rebuilding Caddy from scratch on every run.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/caddy/Dockerfile
          load: true
          push: false
          tags: maintmode-ci-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Install docker-compose shim
        run: |
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'EOF'
          #!/usr/bin/env bash
          docker compose "$@"
          EOF
          sudo chmod +x /usr/local/bin/docker-compose
      - run: make app-up
      - run: make tloc-api
      - run: make app-down
        if: always()
