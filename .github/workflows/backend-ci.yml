name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "cmd/**"
      - "deployment/**"
      - "docs/**"
      - "internal/**"
      - "migrations/**"
      - "test/**"
      - "compose*.yaml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

env:
  DOCKER_COMPOSE_APP_CONFIGS: -f compose.yaml -f compose.app.test.yaml -f compose.app.ci.yaml
  # CI runs without the monitoring profile to keep test runs lean.
  # See Makefile (COMPOSE_PROFILES_FLAGS) for the local/prod default.
  COMPOSE_PROFILES_FLAGS: --profile storages --profile app
  MAINTMODE_IMAGE_TAG: ${{ github.sha }}
  AUTH_IMAGE_TAG: ${{ github.sha }}
  CADDY_IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: -v --build-tags=api ./...
          cache-invalidation-interval: 3

  build-maintmode:
    name: Build binary (maintmode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p tmp/bin
      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: v2.13.1
          args: build -f deployment/maintmode/.build/.goreleaser.yaml --snapshot --single-target --clean --id main --output=./tmp/bin/maintmode

  build-auth:
    name: Build binary (auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p tmp/bin
      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: v2.13.1
          args: build -f deployment/auth/.build/.goreleaser.yaml --snapshot --single-target --clean --id main --output=./tmp/bin/auth

  test:
    name: Backend tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install docker-compose shim
        run: |
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'EOF'
          #!/usr/bin/env bash
          docker compose "$@"
          EOF
          sudo chmod +x /usr/local/bin/docker-compose
      - run: make docker-up
      - run: make tloc
      - name: Collect backend logs
        if: failure()
        run: |
          mkdir -p tmp
          docker-compose --profile storages logs --no-color > tmp/backend-compose.log || true
          docker-compose --profile storages ps -a > tmp/backend-compose-ps.log || true
      - run: make docker-down
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-logs
          path: |
            tmp/backend-compose.log
            tmp/backend-compose-ps.log
          if-no-files-found: ignore
          retention-days: 1

  image-maintmode:
    name: Build image (maintmode)
    runs-on: ubuntu-latest
    # Image build/publish + e2e run only on main/tag pushes, not on PRs.
    # Feature-branch PRs run just lint + build + unit tests (the jobs above).
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
      - build-maintmode
      - build-auth
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/maintmode
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/maintmode/.build/Dockerfile
          load: true
          push: false
          tags: |
            maintmode-ci-maintmode:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=maintmode
          cache-to: type=gha,mode=max,scope=maintmode
      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$TAGS"
      - run: mkdir -p tmp/images
      - run: docker save maintmode-ci-maintmode:${{ github.sha }} -o tmp/images/maintmode.tar
      - uses: actions/upload-artifact@v4
        with:
          name: maintmode-image
          path: tmp/images/maintmode.tar
          if-no-files-found: error
          retention-days: 1

  image-auth:
    name: Build image (auth)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
      - build-maintmode
      - build-auth
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/auth
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/auth/.build/Dockerfile
          load: true
          push: false
          tags: |
            maintmode-ci-auth:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth
      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$TAGS"
      - run: mkdir -p tmp/images
      - run: docker save maintmode-ci-auth:${{ github.sha }} -o tmp/images/auth.tar
      - uses: actions/upload-artifact@v4
        with:
          name: auth-image
          path: tmp/images/auth.tar
          if-no-files-found: error
          retention-days: 1

  image-migrations:
    name: Build image (migrations)
    runs-on: ubuntu-latest
    # Same gate as the app images: publish only on main/tag pushes, not PRs.
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
      - build-maintmode
      - build-auth
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/migrations
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      # The migrations image is tiny (goose base + *.sql), no app source build,
      # and no e2e consumer — so push directly rather than load+save+tar like
      # the app images do.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/migrations/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  api-test:
    name: API e2e tests
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    needs:
      - image-maintmode
      - image-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: maintmode-image
          path: tmp/images
      - uses: actions/download-artifact@v4
        with:
          name: auth-image
          path: tmp/images
      - run: docker load -i tmp/images/maintmode.tar
      - run: docker load -i tmp/images/auth.tar
      - uses: docker/setup-buildx-action@v3
      - name: Build custom Caddy image (xcaddy + ratelimit)
        # Prebuild with a persistent GHA layer cache so the slow xcaddy
        # compile runs only when deployment/caddy/Dockerfile changes. The
        # tag matches compose.app.ci.yaml so `make app-up` reuses it instead
        # of rebuilding Caddy from scratch on every run.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/caddy/Dockerfile
          load: true
          push: false
          tags: maintmode-ci-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Install docker-compose shim
        run: |
          sudo tee /usr/local/bin/docker-compose >/dev/null <<'EOF'
          #!/usr/bin/env bash
          docker compose "$@"
          EOF
          sudo chmod +x /usr/local/bin/docker-compose
      - run: make app-up
      - run: make tloc-api
      - name: Collect API logs
        if: failure()
        run: |
          mkdir -p tmp
          docker-compose ${{ env.DOCKER_COMPOSE_APP_CONFIGS }} ${{ env.COMPOSE_PROFILES_FLAGS }} ps -a > tmp/api-compose-ps.log || true
          docker-compose ${{ env.DOCKER_COMPOSE_APP_CONFIGS }} ${{ env.COMPOSE_PROFILES_FLAGS }} logs --no-color > tmp/api-compose.log || true
      - run: make app-down
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-api-e2e-logs
          path: |
            tmp/api-compose.log
            tmp/api-compose-ps.log
          if-no-files-found: ignore
          retention-days: 1

  # Notify the deploy repo to roll the dev VM with the freshly published
  # maintmode/auth/migrations images. Runs only after images are published and
  # e2e passes. Requires a repo secret DEPLOY_DISPATCH_TOKEN: a PAT with `repo`
  # scope on maintmode-deploy (the default GITHUB_TOKEN can't dispatch across
  # repos). Skipped automatically if the secret is absent.
  trigger-deploy:
    name: Trigger dev deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - image-maintmode
      - image-auth
      - image-migrations
      - api-test
    steps:
      - name: repository_dispatch -> maintmode-deploy
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN not set — skipping cross-repo deploy trigger."
            exit 0
          fi
          TAG="sha-${GITHUB_SHA::7}"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ruko1202/maintmode-deploy/dispatches \
            -d "{\"event_type\":\"deploy-dev\",\"client_payload\":{\"maintmode_tag\":\"${TAG}\",\"auth_tag\":\"${TAG}\",\"migrations_tag\":\"${TAG}\"}}"
