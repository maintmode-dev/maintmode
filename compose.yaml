# MaintMode — single-VM Docker Compose stack.
#
# All services live in this file and are organised into three profiles
# so a single compose command can scope what runs:
#
#   storages     postgres, pg_doorman, redis, apply-migrations
#   app          maintmode, auth, caddy
#   monitoring   victoria-metrics, grafana, loki, promtail, postgres-exporter,
#                redis-exporter, tempo, otel-collector, pyroscope, alloy,
#                vmalert, alertmanager
#
# Bring up the full local stack:
#   docker compose --profile storages --profile app --profile monitoring up -d
#
# Or use the convenience Makefile targets: `make app-up` (full), `make docker-up`
# (storages only).
#
# Overlays:
#   compose.app.test.yaml   — test env configs for `make test-api`
#   compose.app.ci.yaml     — pre-built images for CI
#   compose.k6.yaml         — k6 load testing
#
# Production/dev VM deploy orchestration lives in the separate maintmode-deploy
# repo (pulls images from GHCR). Operator docs: maintmode-docs/ops/

services:
  # -----------------------------------------------------------------
  # Storages
  # -----------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    profiles: ["storages"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintmode
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - theapp

  pg_doorman:
    image: ghcr.io/ozontech/pg_doorman:latest
    container_name: pg_doorman
    profiles: ["storages"]
    restart: unless-stopped
    command: ["pg_doorman", "-l", "info", "/etc/pg_doorman/pg_doorman.toml"]
    ports:
      - "6432:6432"
      - "9127:9127"
    volumes:
      - ./deployment/pg_doorman.toml:/etc/pg_doorman/pg_doorman.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - theapp

  redis:
    image: redis:8-alpine
    container_name: redis
    profiles: ["storages"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - theapp

  apply-migrations:
    image: kukymbr/goose-docker:3.26.0
    container_name: apply-migrations
    profiles: ["storages"]
    environment:
      GOOSE_DBSTRING: 'postgres://postgres:postgres@postgres:5432/maintmode?sslmode=disable'
      GOOSE_DRIVER: postgres
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - theapp

  # -----------------------------------------------------------------
  # Application
  # -----------------------------------------------------------------
  maintmode:
    build:
      context: .
      dockerfile: deployment/maintmode/.build/Dockerfile
    # No container_name: this service is horizontally scalable via
    # `docker compose up --scale maintmode=N`. Docker assigns
    # <project>-maintmode-<N> and DNS `maintmode` resolves to all replicas.
    profiles: ["app"]
    restart: unless-stopped
    # Discovered by Prometheus via docker_sd_configs filter on this label.
    labels:
      prometheus.service: "maintmode"
    environment:
      MAINTMODE_CONFIG_DIR: /app
      MAINTMODE_AUTHZ_DIR: /app/authz
    volumes:
      - ./deployment/maintmode/dev/app.config.yaml:/app/app.config.yaml:ro
      - ./deployment/maintmode/dev/app.secrets.yaml:/app/app.secrets.yaml:ro
      - ./deployment/maintmode/authz:/app/authz:ro
    depends_on:
      postgres:
        condition: service_healthy
      pg_doorman:
        condition: service_started
      apply-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - theapp

  auth:
    build:
      context: .
      dockerfile: deployment/auth/.build/Dockerfile
    # No container_name: this service is horizontally scalable via
    # `docker compose up --scale auth=N`. Docker assigns
    # <project>-auth-<N> and DNS `auth` resolves to all replicas.
    profiles: ["app"]
    restart: unless-stopped
    # Discovered by Prometheus via docker_sd_configs filter on this label.
    labels:
      prometheus.service: "auth"
    environment:
      AUTH_CONFIG_DIR: /app
      AUTH_AUTHZ_DIR: /app/authz
    volumes:
      - ./deployment/auth/dev/app.config.yaml:/app/app.config.yaml:ro
      - ./deployment/auth/dev/app.secrets.yaml:/app/app.secrets.yaml:ro
      - ./deployment/auth/authz:/app/authz:ro
    depends_on:
      postgres:
        condition: service_healthy
      pg_doorman:
        condition: service_started
      redis:
        condition: service_healthy
      apply-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - theapp

  # MailPit — local SMTP sink + web UI for inspecting outgoing email.
  # The auth binary delivers invitation emails here (see deployment/auth/dev
  # notify_transport.email: host=mailpit, port=1025, tls_policy=none). Nothing
  # leaves the host — open the inbox at http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    # Own "mail" profile, not "app": the dev/local stacks opt in (see the
    # Makefile app targets), while prod-up — which passes storages/app/
    # monitoring but not mail — never starts this dev-only email sink.
    profiles: ["mail"]
    restart: unless-stopped
    # MP_WEBROOT mounts the UI under /mail so Caddy can reverse-proxy it on
    # the infra port without rewriting asset paths. Open the inbox at
    # http://localhost:9001/mail/ (via Caddy) or http://localhost:8025/mail/
    # (direct). Note the webroot means bare http://localhost:8025/ now 404s.
    environment:
      MP_WEBROOT: mail
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    networks:
      - theapp

  caddy:
    # Custom image: stock caddy:2-alpine lacks the caddy-ratelimit module
    # used by the perimeter rate limit in the Caddyfile. Built via xcaddy
    # with pinned versions — see deployment/caddy/Dockerfile.
    build:
      context: .
      dockerfile: deployment/caddy/Dockerfile
    container_name: caddy
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "9000:3000"
      - "9001:3001"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./web/static/nginx:/var/www/html:ro
      - ./deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      auth:
        condition: service_healthy
      maintmode:
        condition: service_healthy
    networks:
      - theapp

  # -----------------------------------------------------------------
  # Monitoring
  # -----------------------------------------------------------------
  # VictoriaMetrics — Prometheus-compatible TSDB
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    container_name: victoria-metrics
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "8428:8428"
      - "8429:8429"
    volumes:
      - victoria-metrics:/victoria-metrics-data
      - ./monitoring/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Docker SD reads container list from the daemon socket so every
      # replica of the maintmode/auth services is discovered.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=30d"
    networks:
      - theapp

  # Grafana — metrics & logs UI
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "8003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
      GF_INSTALL_PLUGINS: grafana-pyroscope-datasource
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoria-metrics
      - loki
    networks:
      - theapp

  # Loki — log aggregation
  loki:
    image: grafana/loki:3.3.0
    container_name: loki
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki:/loki
      - ./monitoring/config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - theapp

  # Promtail — ships container logs to Loki
  promtail:
    image: grafana/promtail:3.3.0
    container_name: promtail
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/config/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - theapp

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/maintmode?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - theapp

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - theapp

  # Grafana Tempo — трейсинг-бэкенд. Локальный диск,
  # retention 1 день (см. monitoring/config/tempo/tempo.yaml). Принимает OTLP от
  # otel-collector, запрашивается датасорсом Grafana на :3200. Отдельного UI нет.
  # Тег запиннен (в отличие от соседей на :latest): tempo:latest уехал на v3.0.0
  # с несовместимой схемой конфига (ingester/compactor отвалились). 2.7.x —
  # текущая рабочая линия; бампать осознанно.
  tempo:
    image: grafana/tempo:2.7.1
    profiles: ["monitoring"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - tempo:/var/tempo
      - ./monitoring/config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200" # query/API (internal)
    networks:
      - theapp

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["monitoring"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/config/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
    depends_on:
      - tempo
    networks:
      - theapp

  pyroscope:
    image: grafana/pyroscope:latest
    profiles: ["monitoring"]
    ports:
      - "4040" # internal port
    command:
      - "server"
    networks:
      - theapp

  alloy:
    image: grafana/alloy:latest
    profiles: ["monitoring"]
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - pyroscope
    networks:
      - theapp

  # vmalert — evaluates Prometheus alert rules against VictoriaMetrics.
  # Base compose targets the dev environment: fired alerts are tagged
  # env=dev, which Alertmanager routes to the dev topic in the shared
  # Telegram chat. compose.app.prod.yaml overrides this to env=prod.
  vmalert:
    image: victoriametrics/vmalert:v1.103.0
    container_name: vmalert
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "8880:8880"
    volumes:
      - ./monitoring/config/alerts.yml:/etc/alerts/alerts.yml:ro
    command:
      - "--rule=/etc/alerts/alerts.yml"
      - "--datasource.url=http://victoria-metrics:8428"
      - "--remoteWrite.url=http://victoria-metrics:8428"
      - "--notifier.url=http://alertmanager:9093"
      - "--httpListenAddr=:8880"
      - "--evaluationInterval=30s"
      - "--external.label=env=dev"
    depends_on:
      - victoria-metrics
      - alertmanager
    networks:
      - theapp

  # alertmanager — routes alerts to the Telegram supergroup, dispatching
  # by env label to the right topic. Same alertmanager.yml is mounted in
  # prod via compose.app.prod.yaml; only the bot-token secret differs
  # per environment (deployment/infra/{dev,prod}/telegram_bot_token).
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deployment/infra/dev/telegram_bot_token:/etc/alertmanager/secrets/telegram_bot_token:ro
      - alertmanager:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - theapp

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
  victoria-metrics:
  grafana:
  loki:
  alertmanager:
  tempo:

networks:
  theapp:
    driver: bridge
    name: theapp
