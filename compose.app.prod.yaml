# Production overlay for single-VM Docker Compose deployment.
#
# Activates:
#   - prod app.config.yaml + app.secrets.yaml mounts (deployment/{auth,maintmode}/prod/)
#   - Caddy on :80/:443 with auto Let's Encrypt (Caddyfile.prod)
#   - Grafana admin password from env (no admin/admin default)
#
# Usage:
#   cp .env.prod.sample .env.prod && edit
#   make prod-up
#
# Required env vars in .env.prod:
#   DOMAIN, ACME_EMAIL, MAINTMODE_IMAGE_TAG, AUTH_IMAGE_TAG,
#   GRAFANA_ADMIN_PASSWORD
#
# Telegram alerting: monitoring/config/alertmanager.yml is shared with
# base compose.yaml — the prod overlay only swaps which bot-token file
# is mounted (deployment/infra/prod/...) and flips vmalert's env label
# to prod, so messages land in the prod topic of the shared Telegram
# supergroup. Place the bot token in deployment/infra/prod/
# telegram_bot_token (chmod 600). See
# deployment/infra/prod/telegram_bot_token.sample and
# maintmode-docs/ops/monitoring.md.

services:
  maintmode:
    image: ${MAINTMODE_IMAGE:-ghcr.io/ruko1202/maintmode/maintmode}:${MAINTMODE_IMAGE_TAG:-latest}
    build: null
    volumes:
      - ./deployment/maintmode/prod/app.config.yaml:/app/app.config.yaml:ro
      - ./deployment/maintmode/prod/app.secrets.yaml:/app/app.secrets.yaml:ro

  auth:
    image: ${AUTH_IMAGE:-ghcr.io/ruko1202/maintmode/auth}:${AUTH_IMAGE_TAG:-latest}
    build: null
    volumes:
      - ./deployment/auth/prod/app.config.yaml:/app/app.config.yaml:ro
      - ./deployment/auth/prod/app.secrets.yaml:/app/app.secrets.yaml:ro

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./web/static/nginx:/var/www/html:ro
      - ./deployment/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  vmalert:
    # Override the base env=dev label so Alertmanager dispatches fired
    # alerts to the prod topic of the shared Telegram supergroup.
    command:
      - "--rule=/etc/alerts/alerts.yml"
      - "--datasource.url=http://victoria-metrics:8428"
      - "--remoteWrite.url=http://victoria-metrics:8428"
      - "--notifier.url=http://alertmanager:9093"
      - "--httpListenAddr=:8880"
      - "--evaluationInterval=30s"
      - "--external.label=env=prod"

  alertmanager:
    # Same alertmanager.yml as base, only the bot-token secret comes
    # from deployment/infra/prod/. The token file is gitignored.
    volumes: !override
      - ./monitoring/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deployment/infra/prod/telegram_bot_token:/etc/alertmanager/secrets/telegram_bot_token:ro
      - alertmanager:/alertmanager

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
      GF_INSTALL_PLUGINS: grafana-pyroscope-datasource
