# golangci-lint v2 configuration
# Best practices configuration for Go projects
# Documentation: https://golangci-lint.run/docs/configuration/

version: '2'

run:
  # Timeout for analysis
  timeout: 5m

  # Go version to target
  go: '1.23'

  # Include test files in analysis
  tests: true

  # Module download mode
  modules-download-mode: readonly

output:
  # Use colored-line-number format for clickable paths in terminal
  formats:
    tab:
      path: stdout

  # Show statistics per linter
  show-stats: true

formatters:
  enable:
    - gofmt      # Format code with gofmt
    - goimports  # Organize imports
  settings:
    goimports:
      # Put imports beginning with prefix after 3rd-party packages
      local-prefixes:
        - github.com/ruko1202/maintmode

linters:
  enable:
    # Core linters (enabled by default)
    - errcheck       # Check for unchecked errors
    - govet          # Vet examines Go source code and reports suspicious constructs
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Advanced Go linter (includes gosimple, megacheck)
    - unused         # Check for unused constants, variables, functions and types

    # Additional quality linters
    - revive         # Fast, configurable linter - replacement for golint
    - misspell       # Finds commonly misspelled English words
    - whitespace     # Detect leading/trailing whitespace

    # Bug detection
    - bodyclose      # Check whether HTTP response body is closed
    - copyloopvar    # Detect places where loop variables are copied
    - dupl           # Code clone detection
    - gosec          # Inspect source code for security problems
    - nilerr         # Find code returning nil even when checking error != nil
    - errorlint      # Find code that will cause problems with error wrapping (Go 1.13+)

    # Performance
    - prealloc       # Find slice declarations that could be preallocated
    - gocritic       # Extensible Go source code linter

    # Complexity
    - gocyclo        # Compute cyclomatic complexity
    - gocognit       # Compute cognitive complexity
    - funlen         # Detect long functions
    - nestif         # Report deeply nested if statements

    # Code patterns
    - goconst        # Find repeated strings that could be replaced by constants
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Report unused function parameters
    - wastedassign   # Find wasted assignments
    - usestdlibvars  # Detect possibility to use standard library variables/constants
    - depguard
    - forbidigo      # Forbid specific identifiers (see settings.forbidigo)

    # Testing
    - thelper        # Detect test helpers without t.Helper()
    - tparallel      # Detect inappropriate usage of t.Parallel()

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    govet:
      enable-all: true
      disable:
        - fieldalignment  # Too strict for most projects
        - shadow          # Can be noisy

    staticcheck:
      checks:
        - all
        - -ST1000 # disable `ST1000: at least one file in a package should have a package comment`

    misspell:
      locale: US

    revive:
      confidence: 0.8
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported #  exported: exported function XXX should have comment or be unexported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: package-comments
          disabled: true

    gosec:
      excludes:
        - G104  # Audit errors not checked (covered by errcheck)
        - G306  # Expect WriteFile permissions to be 0600 or less (too strict)

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting
        - whyNoLint
        - hugeParam
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 512

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    funlen:
      lines: 120
      statements: 50

    forbidigo:
      # An explicit list only. Enabling forbidigo without one activates its
      # defaults (fmt.Print*, println), which light up the whole repository.
      #
      # The option moved to an external module and is imported as package
      # `client`, so the pattern had to change with it: `xhttp.WithBodyLogging`
      # matches nothing now, and a rule that silently stops matching is worse
      # than no rule.
      #
      # analyze-types stays false. It would let the pattern name a fully
      # qualified path, but this config pins run.go to 1.23 while the module
      # targets a newer Go, and type analysis does not load under that skew —
      # the rule silently matched nothing when it was tried. Textual matching on
      # `client.WithBodyLogging` is verified to fire (negative probe below).
      #
      # The former reason for keeping it false — the pattern also matching the
      # option's own definition — no longer applies: that definition now lives
      # outside this repository.
      analyze-types: false
      forbid:
        - pattern: '^client\.WithBodyLogging$'
          msg: >-
            WithBodyLogging writes request and response bodies to the log, and
            bodies are the one thing redaction cannot make safe. It is a local
            debugging tool: never enable it in code that ships (RUK-248).

    nestif:
      min-complexity: 4

    goconst:
      min-len: 3
      min-occurrences: 3

    dupl:
      threshold: 150

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    unparam:
      check-exported: false

    depguard:
      rules:
        internal/app:
          # Defines package matching behavior. Available modes:
          # - `original`: allowed if it doesn't match the deny list and either matches the allow list or the allow list is empty.
          # - `strict`: allowed only if it matches the allow list and either doesn't match the deny list or the allow rule is more specific (longer) than the deny rule.
          # - `lax`: allowed if it doesn't match the deny list or the allow rule is more specific (longer) than the deny rule.
          # Default: "original"
          list-mode: original
          # List of file globs that will match this list of settings to compare against.
          # By default, if a path is relative, it is relative to the directory where the golangci-lint command is executed.
          # The placeholder '${base-path}' is substituted with a path relative to the mode defined with `run.relative-path-mode`.
          # The placeholder '${config-path}' is substituted with a path relative to the configuration file.
          # Default: $all
          files:
            - "!**/cmd/**/*.go"
            - "!**/internal/app/**/*.go"
            - "!**/internal/server/*.go"
            - "!**/internal/server/**/*.go"
            # Integration test helpers and integration-style main_test.go
            # files legitimately wire the full bootstrap stack.
            - "!**/test/utils/bootstrap/*.go"
            - "!**/test/**/main_test.go"
            - "!**/internal/services/maint/test/main_test.go"
          # List of allowed packages.
          # Entries can be a variable (starting with $), a string prefix, or an exact match (if ending with $).
          # Default: []
          allow: []
          # List of packages that are not allowed.
          # Entries can be a variable (starting with $), a string prefix, or an exact match (if ending with $).
          # Default: []
          deny:
            - pkg: github.com/ruko1202/maintmode/internal/app/
              desc: "app package is not allowed"
        public-api:
          list-mode: lax
          files:
            - "**/internal/app/api/public/*.go"
            - "**/internal/app/api/public/**/*.go"
            - "!**/*_test.go"
          allow:
            - github.com/ruko1202/maintmode/internal/app/api/httperrors
            - github.com/ruko1202/maintmode/internal/app/api/public
          deny:
            - pkg: github.com/ruko1202/maintmode/internal/app/api
              desc: "api package is not allowed"
        ui-api:
          list-mode: lax
          files:
            - "**/internal/app/api/ui/*.go"
            - "**/internal/app/api/ui/**/*.go"
            # Хендлер-тесты легитимно поднимают чужие api-пакеты как фикстуры
            # (напр. ui/calendar тесты создают maintenance через public/maint).
            - "!**/*_test.go"
          allow:
            - github.com/ruko1202/maintmode/internal/app/api/httperrors
            - github.com/ruko1202/maintmode/internal/app/api/ui
          deny:
            - pkg: github.com/ruko1202/maintmode/internal/app/api
              desc: "api package is not allowed"

        # ---------------------------------------------------------------------
        # «Крепость сторов» (RUK-193, modular monolith Этап A).
        # Стор любого доменного модуля (core/auth/notificator/audit) разрешено
        # импортировать только из пакетов ТОГО ЖЕ модуля. Импорт чужого стора —
        # прямой доступ к данным другого домена в обход интерфейса — ошибка.
        # Кросс-доменный доступ к данным — только через consumer-интерфейс,
        # объявленный у потребителя (напр. calendar.NotifyTargetsReader).
        #
        # Раскладка модуль→пакеты — источник истины в
        # maintmode-docs/architecture/architecture.md §2.1. Держать синхронно.
        #
        # files: покрывают services+storages модуля; bootstrap (internal/app/**)
        # и тест-фикстуры (*_test.go) исключены — они легитимно видят все модули.
        # Правило про storage-слой: межмодульные service-зависимости (напр.
        # maint→maintnotify.Service) под запрет НЕ попадают.
        #
        # Слои-точки-входа (goque_processors, gateways) НЕ классифицируются по
        # модулям, но и не должны трогать storage напрямую — для них отдельная
        # группа entrypoints-no-stores ниже запрещает ЛЮБОЙ internal/storages/*
        # (доступ к данным только через сервисы). api-хендлеры (internal/app/api)
        # сознательно вне крепости: они и так ходят через сервисы, а их обратные
        # импорты сторожат группы public-api/infra-api/ui-api выше.
        # ---------------------------------------------------------------------
        module-core-stores:
          list-mode: lax
          files:
            - "**/internal/services/maint/*.go"
            - "**/internal/services/maint/**/*.go"
            - "**/internal/services/resources/*.go"
            - "**/internal/services/resources/**/*.go"
            - "**/internal/services/conflicts/*.go"
            - "**/internal/services/conflicts/**/*.go"
            - "**/internal/services/calendar/*.go"
            - "**/internal/services/calendar/**/*.go"
            - "**/internal/services/userpicker/*.go"
            - "**/internal/services/userpicker/**/*.go"
            - "**/internal/services/usersummary/*.go"
            - "**/internal/services/usersummary/**/*.go"
            - "**/internal/storages/maintenances/*.go"
            - "**/internal/storages/maintenances/**/*.go"
            - "**/internal/storages/resources/*.go"
            - "**/internal/storages/resources/**/*.go"
            - "**/internal/storages/conflicts/*.go"
            - "**/internal/storages/conflicts/**/*.go"
            - "**/internal/storages/conflict_snapshots/*.go"
            - "**/internal/storages/conflict_snapshots/**/*.go"
            - "!**/*_test.go"
          deny:
            # auth storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/users
              desc: "core must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/useridentities
              desc: "core must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/refreshtoken
              desc: "core must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/blacklisttoken
              desc: "core must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/userinvitations
              desc: "core must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/distributedlock
              desc: "core must not import auth storages directly — use a consumer interface"
            # notificator storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifytargets
              desc: "core must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifychannel
              desc: "core must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/deferrednotifications
              desc: "core must not import notificator storages directly — use a consumer interface"
            # audit storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/audit
              desc: "core must not import audit storages directly — use a consumer interface"
            # integration storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/integration
              desc: "core must not import integration storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/datakey
              desc: "core must not import integration storages directly — use a consumer interface"
            # license storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/licensecache
              desc: "core must not import the license storage directly — use a consumer interface"

        module-auth-stores:
          list-mode: lax
          files:
            - "**/internal/services/user/*.go"
            - "**/internal/services/user/**/*.go"
            - "**/internal/services/token/*.go"
            - "**/internal/services/token/**/*.go"
            - "**/internal/services/authz/*.go"
            - "**/internal/services/authz/**/*.go"
            - "**/internal/services/jwtverifier/*.go"
            - "**/internal/services/jwtverifier/**/*.go"
            - "**/internal/services/invitation/*.go"
            - "**/internal/services/invitation/**/*.go"
            - "**/internal/services/oauthprovider/*.go"
            - "**/internal/services/oauthprovider/**/*.go"
            - "**/internal/services/auth/*.go"
            - "**/internal/services/auth/**/*.go"
            - "**/internal/services/state_codec/*.go"
            - "**/internal/services/state_codec/**/*.go"
            - "**/internal/storages/users/*.go"
            - "**/internal/storages/users/**/*.go"
            - "**/internal/storages/useridentities/*.go"
            - "**/internal/storages/useridentities/**/*.go"
            - "**/internal/storages/refreshtoken/*.go"
            - "**/internal/storages/refreshtoken/**/*.go"
            - "**/internal/storages/blacklisttoken/*.go"
            - "**/internal/storages/blacklisttoken/**/*.go"
            - "**/internal/storages/userinvitations/*.go"
            - "**/internal/storages/userinvitations/**/*.go"
            - "**/internal/storages/distributedlock/*.go"
            - "**/internal/storages/distributedlock/**/*.go"
            - "!**/*_test.go"
          deny:
            # core storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/maintenances
              desc: "auth must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/resources
              desc: "auth must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflicts
              desc: "auth must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflict_snapshots
              desc: "auth must not import core storages directly — use a consumer interface"
            # notificator storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifytargets
              desc: "auth must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifychannel
              desc: "auth must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/deferrednotifications
              desc: "auth must not import notificator storages directly — use a consumer interface"
            # audit storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/audit
              desc: "auth must not import audit storages directly — use a consumer interface"
            # integration storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/integration
              desc: "auth must not import integration storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/datakey
              desc: "auth must not import integration storages directly — use a consumer interface"
            # license storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/licensecache
              desc: "auth must not import the license storage directly — use a consumer interface"

        module-notificator-stores:
          list-mode: lax
          files:
            - "**/internal/services/notifytargets/*.go"
            - "**/internal/services/notifytargets/**/*.go"
            - "**/internal/services/messaging/*.go"
            - "**/internal/services/messaging/**/*.go"
            - "**/internal/services/maintnotify/*.go"
            - "**/internal/services/maintnotify/**/*.go"
            - "**/internal/services/deferrednotifications/*.go"
            - "**/internal/services/deferrednotifications/**/*.go"
            # transportresolver is the delivery side of the integration split
            # (RUK-196): it must reach configs/secrets ONLY through the
            # integration service, never the ciphertext/DEK tables — its deny
            # list below includes the integration storages.
            - "**/internal/services/transportresolver/*.go"
            - "**/internal/services/transportresolver/**/*.go"
            - "**/internal/storages/notifychannel/*.go"
            - "**/internal/storages/notifychannel/**/*.go"
            - "**/internal/storages/notifytargets/*.go"
            - "**/internal/storages/notifytargets/**/*.go"
            - "**/internal/storages/deferrednotifications/*.go"
            - "**/internal/storages/deferrednotifications/**/*.go"
            - "!**/*_test.go"
          deny:
            # core storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/maintenances
              desc: "notificator must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/resources
              desc: "notificator must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflicts
              desc: "notificator must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflict_snapshots
              desc: "notificator must not import core storages directly — use a consumer interface"
            # auth storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/users
              desc: "notificator must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/useridentities
              desc: "notificator must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/refreshtoken
              desc: "notificator must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/blacklisttoken
              desc: "notificator must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/userinvitations
              desc: "notificator must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/distributedlock
              desc: "notificator must not import auth storages directly — use a consumer interface"
            # audit storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/audit
              desc: "notificator must not import audit storages directly — use a consumer interface"
            # integration storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/integration
              desc: "notificator must not import integration storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/datakey
              desc: "notificator must not import integration storages directly — use a consumer interface"
            # license storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/licensecache
              desc: "notificator must not import the license storage directly — use a consumer interface"

        module-audit-stores:
          list-mode: lax
          files:
            - "**/internal/services/auditor/*.go"
            - "**/internal/services/auditor/**/*.go"
            - "**/internal/services/auditpublisher/*.go"
            - "**/internal/services/auditpublisher/**/*.go"
            - "**/internal/storages/audit/*.go"
            - "**/internal/storages/audit/**/*.go"
            - "!**/*_test.go"
          deny:
            # core storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/maintenances
              desc: "audit must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/resources
              desc: "audit must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflicts
              desc: "audit must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflict_snapshots
              desc: "audit must not import core storages directly — use a consumer interface"
            # auth storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/users
              desc: "audit must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/useridentities
              desc: "audit must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/refreshtoken
              desc: "audit must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/blacklisttoken
              desc: "audit must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/userinvitations
              desc: "audit must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/distributedlock
              desc: "audit must not import auth storages directly — use a consumer interface"
            # notificator storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifychannel
              desc: "audit must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifytargets
              desc: "audit must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/deferrednotifications
              desc: "audit must not import notificator storages directly — use a consumer interface"
            # integration storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/integration
              desc: "audit must not import integration storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/datakey
              desc: "audit must not import integration storages directly — use a consumer interface"
            # license storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/licensecache
              desc: "audit must not import the license storage directly — use a consumer interface"

        # Integration registry module (RUK-196): the integration service + its
        # kinds, the DEK rotator, and the two stores holding encrypted
        # credentials. The stores are walled in here so no other module can read
        # ciphertext/DEKs directly — only this module: the integration service
        # (encrypt-on-write / mask-on-read) and the dekrotator (startup KEK
        # re-wrap over storages/datakey).
        module-integration-stores:
          list-mode: lax
          files:
            - "**/internal/services/integration/*.go"
            - "**/internal/services/integration/**/*.go"
            - "**/internal/services/dekrotator/*.go"
            - "**/internal/services/dekrotator/**/*.go"
            - "**/internal/storages/integration/*.go"
            - "**/internal/storages/integration/**/*.go"
            - "**/internal/storages/datakey/*.go"
            - "**/internal/storages/datakey/**/*.go"
            - "!**/*_test.go"
          deny:
            # core storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/maintenances
              desc: "integration must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/resources
              desc: "integration must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflicts
              desc: "integration must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflict_snapshots
              desc: "integration must not import core storages directly — use a consumer interface"
            # auth storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/users
              desc: "integration must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/useridentities
              desc: "integration must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/refreshtoken
              desc: "integration must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/blacklisttoken
              desc: "integration must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/userinvitations
              desc: "integration must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/distributedlock
              desc: "integration must not import auth storages directly — use a consumer interface"
            # notificator storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifychannel
              desc: "integration must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifytargets
              desc: "integration must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/deferrednotifications
              desc: "integration must not import notificator storages directly — use a consumer interface"
            # audit storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/audit
              desc: "integration must not import audit storages directly — use a consumer interface"
            # license storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/licensecache
              desc: "integration must not import the license storage directly — use a consumer interface"

        # License module: the license service and its cache store.
        # licensecache is walled in here — only the license service reads/writes
        # the cached license; enforcement consumers (invitation, user, the
        # suspend middleware) go through license.Service via consumer
        # interfaces. The license service itself reaches users/invitations/
        # audit data ONLY through consumer interfaces (bootstrap injects the
        # concrete stores), so every other module storage is denied.
        module-license-stores:
          list-mode: lax
          files:
            - "**/internal/services/license/*.go"
            - "**/internal/services/license/**/*.go"
            - "**/internal/storages/licensecache/*.go"
            - "**/internal/storages/licensecache/**/*.go"
            - "!**/*_test.go"
          deny:
            # core storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/maintenances
              desc: "license must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/resources
              desc: "license must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflicts
              desc: "license must not import core storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/conflict_snapshots
              desc: "license must not import core storages directly — use a consumer interface"
            # auth storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/users
              desc: "license must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/useridentities
              desc: "license must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/refreshtoken
              desc: "license must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/blacklisttoken
              desc: "license must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/userinvitations
              desc: "license must not import auth storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/distributedlock
              desc: "license must not import auth storages directly — use a consumer interface"
            # notificator storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifychannel
              desc: "license must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/notifytargets
              desc: "license must not import notificator storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/deferrednotifications
              desc: "license must not import notificator storages directly — use a consumer interface"
            # audit storage
            - pkg: github.com/ruko1202/maintmode/internal/storages/audit
              desc: "license must not import audit storages directly — use a consumer interface"
            # integration storages
            - pkg: github.com/ruko1202/maintmode/internal/storages/integration
              desc: "license must not import integration storages directly — use a consumer interface"
            - pkg: github.com/ruko1202/maintmode/internal/storages/datakey
              desc: "license must not import integration storages directly — use a consumer interface"

        # Слои-точки-входа (goque_processors, gateways) не должны обращаться к
        # storage напрямую — только через сервисы. Запрещаем ЛЮБОЙ storages/*,
        # чтобы инвариант был enforced, а не assumed (RUK-193 ship-review).
        # notifytransport (внешний транспорт) и gateways/auth (S2S, уходит в
        # этапе B) сторов не держат — общий запрет их не задевает.
        entrypoints-no-stores:
          list-mode: lax
          files:
            - "**/internal/goque_processors/*.go"
            - "**/internal/goque_processors/**/*.go"
            - "**/internal/gateways/*.go"
            - "**/internal/gateways/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/ruko1202/maintmode/internal/storages
              desc: "entrypoint layers (goque_processors, gateways) must not import storage directly — go through a service"
    nolintlint:
      allow-unused: false  # По умолчанию false, но явное указание помогает избежать путаницы
      allow-no-explanation: [] # Можно заставить писать пояснения к nolint
      require-explanation: true # Требовать комментарий, почему линтер отключен
      require-specific: true    # Запрещает использовать просто // nolint, требует // nolint:errcheck

  exclusions:
    rules:
      # Relax linting for test files
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - errcheck
          - dupl
          - gosec
          - funlen
          - goconst
          # Tests are where WithBodyLogging is legitimately exercised — the option
          # would be unverifiable otherwise.
          - forbidigo

      # Exclude linters for generated files
      - path: ".*\\.pb\\.go"
        linters:
          - all

      # Exclude specific rules for test files
      - path: _test\.go
        text: "don't use underscores"
        linters:
          - revive

      # Allow weak random in tests
      - path: _test\.go
        text: "G404:"
        linters:
          - gosec

      # Exclude package-comments rule from revive
      - text: "package-comments"
        linters:
          - revive

      # The notification templates ship the British "cancelled" (it is also the
      # maint_cancelled.tmpl filename). The render tests assert message bodies
      # byte-for-byte, so their literals must reproduce that spelling exactly —
      # "fixing" it to US English would break the assertions rather than the
      # product text.
      - path: services/maintnotify/render/.*_test\.go
        text: "`[Cc]ancelled` is a misspelling"
        linters:
          - misspell

issues:
  # Maximum issues per linter (0 = unlimited)
  max-issues-per-linter: 0

  # Maximum count of same issues (0 = unlimited)
  max-same-issues: 0

  # Show only new issues
  new: false

  # Fix found issues if supported
  fix: false

severity:
  # Default severity
  default: error

  # Custom severity rules
  rules:
    - linters:
        - dupl
        - funlen
        - gocognit
      severity: warning