# Grafana Tempo — distributed tracing backend.
#
# Single-binary, локальный диск, retention 1 день. Спаны прилетают через
# otel-collector (otel → tempo:4317). Запрашивается датасорсом Grafana на :3200.
# Отдельного UI нет — трейсы смотрим через Grafana.

server:
  http_listen_port: 3200      # query/API — на него смотрит Grafana datasource
  grpc_listen_port: 9095

# OTLP-приём: otel-collector форвардит сюда.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m      # быстрый флаш на низком трафике локалки

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 24h      # 1 день (RUK-189)

# Service Graph: metrics-generator строит per-edge метрики (request/error/
# duration) из спанов и remote-write'ит их в VictoriaMetrics (Prometheus-
# совместимая). Grafana рисует граф из этих метрик. Включён ТОЛЬКО процессор
# service-graphs (без span-metrics), чтобы кардинальность/место были минимальны.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal   # свой небольшой WAL, отдельно от trace WAL
    remote_write:
      - url: http://victoria-metrics:8428/api/v1/write
        send_exemplars: true

# Генератор работает per-tenant; в single-binary процессоры включаются через
# overrides для дефолтного (анонимного) тенанта.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
