# Grafana Tempo — distributed tracing backend.
#
# Single-binary, local disk, retention 1 day. Spans arrive through the
# otel-collector (otel -> tempo:4317). Queried by the Grafana datasource on :3200.
# It has no UI of its own — traces are viewed through Grafana.

server:
  http_listen_port: 3200      # query/API — what the Grafana datasource points at
  grpc_listen_port: 9095

# OTLP intake: the otel-collector forwards here.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m      # a fast flush at the low traffic of a local setup

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 24h      # 1 day (RUK-189)

# Service Graph: the metrics-generator builds per-edge metrics (request/error/
# duration) from the spans and remote-writes them to VictoriaMetrics (Prometheus-
# compatible). Grafana draws the graph from those metrics. ONLY the service-graphs
# processor is enabled (no span-metrics) to keep cardinality/disk minimal.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal   # its own small WAL, separate from the trace WAL
    remote_write:
      - url: http://victoria-metrics:8428/api/v1/write
        send_exemplars: true

# The generator works per-tenant; in single-binary mode the processors are
# enabled through overrides for the default (anonymous) tenant.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
