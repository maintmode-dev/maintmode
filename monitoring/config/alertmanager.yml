# Alertmanager config — minimal default.
#
# Locally, alerts are routed to a null receiver and are only visible in
# the alertmanager UI at http://localhost:9093.
#
# In production, set ALERTMANAGER_SLACK_WEBHOOK (or replace this file via
# a secrets mount) and switch the default route to the slack receiver.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # No-op receiver. Inspect fired alerts in the Alertmanager UI on :9093.

  # Example Slack receiver — duplicate, fill in webhook, and reference
  # from the route above.
