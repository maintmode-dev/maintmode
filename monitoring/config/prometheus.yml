global:
  scrape_interval: 15s
  external_labels:
    cluster: 'maintmode-dev'
    environment: 'development'

scrape_configs:
  # MaintMode Application
  - job_name: 'maintmode'
    metrics_path: /metrics
    static_configs:
      - targets: ['maintmode:8001']
        labels:
          service_name: 'maintmode'
          component: 'application'

  # pg_doorman Connection Pooler
  - job_name: 'pg_doorman'
    static_configs:
      - targets: ['pg_doorman:9127']
        labels:
          service_name: 'pg_doorman'
          component: 'connection-pooler'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service_name: 'postgres'
          component: 'database'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service_name: 'redis'
          component: 'cache'
