global:
  scrape_interval: 15s
  external_labels:
    cluster: 'maintmode-dev'
    environment: 'development'

scrape_configs:
  # maintmode + auth: discovered via the Docker socket so every replica
  # is scraped (docker compose up --scale maintmode=N --scale auth=N).
  # Containers opt in via the `prometheus.service` Docker label set in
  # compose.yaml — that label filter already scopes us to maintmode's own
  # containers, so unrelated stacks sharing the daemon are excluded.
  #
  # docker_sd emits one target per exposed port, so a container that also
  # exposes the app port (8000) yields a second `<ip>:8000` target. We keep
  # only the metrics port (8001). The previous `keep` on
  # __meta_docker_network_name was both redundant and fragile: that meta
  # label can resolve empty (it did here), silently dropping every target so
  # the Echo dashboard showed "No data" with no scrape target at all.
  - job_name: 'maintmode'
    metrics_path: /metrics
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        port: 8001
        filters:
          - name: label
            values: ["prometheus.service=maintmode"]
    relabel_configs:
      - source_labels: [__meta_docker_port_private]
        regex: '8001'
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
      - target_label: service_name
        replacement: 'maintmode'
      - target_label: component
        replacement: 'application'

  # pg_doorman Connection Pooler
  - job_name: 'pg_doorman'
    static_configs:
      - targets: ['pg_doorman:9127']
        labels:
          service_name: 'pg_doorman'
          component: 'connection-pooler'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service_name: 'postgres'
          component: 'database'

  # Valkey Exporter
  - job_name: 'valkey'
    static_configs:
      - targets: ['valkey-exporter:9121']
        labels:
          service_name: 'valkey'
          component: 'cache'

  # cAdvisor — per-container resource usage (container_* metrics).
  # cAdvisor labels each series with `name` (the Docker container name).
  # Relabel it to the same `service_name` key every other job uses so a
  # single $service dropdown finds the maintmode containers without editing
  # container_name filters. Series without a container name (the
  # machine-level roll-up) get service_name='host'.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'container'
    metric_relabel_configs:
      - source_labels: [name]
        regex: '(.+)'
        target_label: service_name
        replacement: '$1'
      - source_labels: [service_name]
        regex: '^$'
        target_label: service_name
        replacement: 'host'

  # node-exporter — host-level totals (node_* metrics): the "available
  # resources" the VM has, against which cAdvisor "consumed" is compared.
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service_name: 'host'
          component: 'node'

  # Caddy — perimeter reverse proxy / rate limiter / load balancer.
  # Metrics on the admin endpoint :2019/metrics (enabled via `metrics` in the
  # Caddyfile global block). Gives request rate, latency, and 4xx/5xx at the
  # edge (incl. 429s from the rate limiter), plus upstream health — how many
  # maintmode replicas Caddy considers healthy (drain visibility).
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
        labels:
          service_name: 'caddy'
          component: 'proxy'
