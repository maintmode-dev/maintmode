server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect logs from every Docker container
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # service_name = the docker-compose service (a stable name, WITHOUT the
      # replica number). Otherwise Loki derives service_name from the container
      # name (<project>-maintmode-<N>), which changes on every redeploy and does
      # not match service_name="maintmode" in the metrics. We set it explicitly
      # from the com.docker.compose.service label so logs and metrics line up.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service_name
      # Extract the container name (the specific replica — for pinpoint debugging)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container_name
      # Add the job label
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: job
        replacement: docker-logs
      # Add the environment label
      - target_label: environment
        replacement: development
      # Add the cluster label
      - target_label: cluster
        replacement: maintmode-dev

    # Pipeline for processing the logs
    pipeline_stages:
      # Extract the log level (INFO, ERROR, WARN, DEBUG)
      - regex:
          expression: '^\S+\s+(?P<level>INFO|ERROR|WARN|DEBUG|FATAL|PANIC|TRACE)'

      # Add the extracted level as a label
      - labels:
          level:

  # Collect logs from the host system
  - job_name: host-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: host-logs
          __path__: /var/log/**/*.log
          environment: development
          cluster: maintmode-dev
