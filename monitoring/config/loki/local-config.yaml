auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: loki
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Настройки для разработки
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_streams_per_user: 0
  max_line_size: 256kb

  # Время хранения логов (14 дней). Логи объёмнее метрик и нужны для разбора
  # недавних инцидентов, а не истории — поэтому короче метрик (30d).
  retention_period: 336h

  # Пределы для запросов (чуть больше retention, чтобы покрыть весь период)
  split_queries_by_interval: 30m
  max_query_length: 337h
  max_query_parallelism: 32

table_manager:
  retention_deletes_enabled: true
  retention_period: 336h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
  delete_request_cancel_period: 24h
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
