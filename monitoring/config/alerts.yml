# Prometheus-compatible alerting rules evaluated by vmalert against
# VictoriaMetrics. Fired alerts are routed to alertmanager.
#
# Starter set focused on single-VM Docker Compose deployment health.
# Extend with app-level SLOs as MaintMode evolves.
#
# Every rule sets `runbook_url` to the matching section in
# maintmode-docs/ops/alert-runbooks.md so on-call has a one-click
# triage doc in the Telegram message.

groups:
  - name: maintmode.availability
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target down"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.job }}). Container likely stopped, crashed, or network is partitioned."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#instancedown"

      - alert: HighHTTP5xxRate
        # The app exposes OTel HTTP server metrics
        # (http_server_request_duration_seconds_*), with the response status in
        # the http_response_status_code label — NOT the old echo_http_requests_total
        # series, which never existed in this stack and shipped the rule dead.
        # Same metric the maintmode-app dashboard's 5xx panels query (RUK-191).
        expr: |
          sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          /
          sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }}: 5xx rate > 5%"
          description: "Service {{ $labels.service_name }} is returning more than 5% 5xx responses over the last 5 minutes."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#highhttp5xxrate"

      - alert: MaintmodeCrashLooping
        # process_start_time_seconds resets on every process (re)start, so
        # changes() over a window counts restarts. A healthy rolling deploy
        # restarts each replica ONCE; several restarts in a few minutes means a
        # crash loop or a deploy that keeps failing its health check and being
        # recreated. Counted per instance so one flapping replica is enough.
        # for: 30s so a single planned restart (changes briefly = 1, not > 3)
        # never trips it, but a genuine loop fires fast.
        expr: changes(process_start_time_seconds{job=~"maintmode"}[5m]) > 3
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is crash-looping / redeploying repeatedly"
          description: "{{ $labels.instance }} has restarted {{ $value }} times in the last 5 minutes. A rolling deploy restarts a replica once — repeated restarts mean a crash loop or a deploy failing its readiness check. Check the container logs and the last deploy."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#maintmodecrashlooping"

  # Login failures are invisible to HighHTTP5xxRate: a rejected token is a 401
  # or a 400, never a 5xx (see httperrors/mapper.go — ErrInvalidAccessToken and
  # ErrTokenExpired map to 401, ErrUnsupportedProvider to 400). So a total
  # breakage of Google ID-token verification — expired JWKS cache, rotated
  # client_id, Google outage, a bad config deploy — locks every user out while
  # every availability alert stays green. These rules close that gap.
  #
  # All three use http_route, which the OTel echo middleware sets to the
  # registered route pattern. Verified against a live /metrics scrape rather
  # than assumed: an earlier rule in this file shipped dead against a series
  # that never existed.
  - name: maintmode.auth
    interval: 30s
    rules:
      - alert: OAuthExchangeFailing
        # The BFF posts a Google id_token here and gets an app token pair back.
        # A healthy exchange is ~all 200s: the BFF only calls it after Google
        # has already authenticated the user, so a 4xx means WE rejected a token
        # Google just issued — bad audience (client_id drift), unreachable or
        # stale JWKS, or clock skew. Not user error, so the threshold is low.
        #
        # Rate-based, not a raw count: the endpoint sees little traffic, and a
        # ratio would swing wildly on one failure against a handful of logins.
        #
        # 405 is EXCLUDED, and the exclusion is load-bearing in prod. This route
        # is wrapped in middlewares.NotAllowedInProd (server/api_server.go),
        # which returns ErrMethodNotAllowedInProd -> 405 (httperrors/mapper.go).
        # So in prod every call here — a stray scanner, a stale client, anything
        # — is a 405, and a bare `4..` matcher would hold this critical alert
        # permanently open on an endpoint that is doing exactly its job. Note
        # the sibling rule below already states the endpoint is blocked in prod;
        # that is the same fact, and this matcher has to agree with it.
        expr: |
          sum(rate(http_server_request_duration_seconds_count{
            http_route="/api/v1/login/oauth/exchange/google",
            http_response_status_code=~"4..",
            http_response_status_code!="405"
          }[10m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Google ID-token exchange is rejecting logins"
          description: "The BFF's id_token exchange has been returning 4xx for 10m. The BFF only calls this after Google authenticated the user, so we are rejecting tokens Google just issued — no new user can log in. Check JWKS reachability, that oauth/google/client_id still matches the client maintmode-ui uses, and the container clock."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#oauthexchangefailing"

      - alert: InvitationAcceptFailing
        # In prod the exchange endpoint above is blocked by NotAllowedInProd, so
        # invitation acceptance is THE login path: it runs the same
        # provider.VerifyToken. Some 4xx here is normal (expired or already-used
        # invite, email mismatch), so this fires on a rate high enough to mean
        # systemic breakage rather than one user fumbling a stale link.
        expr: |
          sum(rate(http_server_request_duration_seconds_count{
            http_route="/api/v1/users/invitations/accept",
            http_response_status_code=~"4.."
          }[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Invitation acceptance is failing repeatedly"
          description: "More than ~3 invitation accepts per minute have failed with 4xx for 10m. Isolated failures are expected (expired or reused invite, email mismatch), but a sustained rate means ID-token verification or the invitation flow is broken — and in prod this is the only way a new user can sign in."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#invitationacceptfailing"

      - alert: TokenRefreshFailureRateHigh
        # /refresh returning 401 is routine — every expired refresh token lands
        # here and the BFF re-authenticates. So this is a RATIO, not a rate, and
        # the threshold is deliberately high: only a majority-failing refresh
        # endpoint is worth waking someone. That looks like the signing key
        # changing under live sessions, or the refresh-token store being
        # unreadable, both of which log every session out at once.
        expr: |
          sum(rate(http_server_request_duration_seconds_count{
            http_route="/api/v1/refresh",
            http_response_status_code=~"4.."
          }[10m]))
          /
          clamp_min(sum(rate(http_server_request_duration_seconds_count{
            http_route="/api/v1/refresh"
          }[10m])), 0.001)
          > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Most token refreshes are failing"
          description: "Over 50% of /api/v1/refresh calls have returned 4xx for 15m. A single expired refresh token is normal; a majority failing means the JWT signing key rotated under live sessions or the refresh-token store is unreadable — every active user is being logged out."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#tokenrefreshfailureratehigh"

  - name: maintmode.audit
    interval: 30s
    rules:
      - alert: AuditWriteErrors
        # The audit-write goque processor increments this counter when an
        # audit_log INSERT fails (RUK-179). The task is retried, but a sustained
        # rate>0 means the compliance audit trail is falling behind or a write is
        # permanently failing — which must never be silent. Alert on any
        # sustained rate.
        expr: sum(rate(audit_write_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Audit log writes are failing"
          description: "The audit-write processor has been failing to insert audit_log rows for 5m. Audit events are queued and retried, but the trail is behind — investigate the audit store / DB health."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#auditwriteerrors"

  - name: maintmode.notify
    interval: 30s
    rules:
      - alert: MaintNotifyOwnerMentionRejected
        # The renderer refuses a stored messenger handle that carries control
        # characters or Slack markup metacharacters, and falls back to the
        # owner's display name. Input validation already rejects those, so a
        # rejection means a value reached the database around it — direct SQL, a
        # migration, or a validation gap. The notification still goes out, so
        # nothing else surfaces this.
        #
        # Only reason="rejected" is alerted. reason="unresolved" tracks the auth
        # service being unreachable from a background task, which its own
        # availability alerts already cover and which is transient by nature.
        expr: sum(rate(maint_notify_owner_mention_degraded_total{reason="rejected"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Owner messenger handles are being rejected by the notification sanitizer"
          description: "A stored messenger handle has been failing the render-time sanitizer for 15m. Input validation should have made this impossible — find the row and how the value got in."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#maintnotifyownermentionrejected"

      - alert: MaintNotifyDispatchErrors
        # The dispatch path swallows these failures so a business operation that
        # already committed still reports success. Each increment is therefore a
        # lifecycle notification that was dropped with nothing else to show for
        # it — no error surfaces to the API client and no retry follows.
        expr: sum(rate(maint_notify_dispatch_errors_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Maintenance notifications are being dropped during dispatch"
          description: "Notification dispatch has been failing for 15m (see the reason label: resolve = notify targets unreadable, render = template failure). Affected maintenances started, completed or were cancelled without notifying anyone."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#maintnotifydispatcherrors"

  - name: maintmode.storage
    interval: 30s
    rules:
      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_database_numbackends)
          /
          max(pg_settings_max_connections)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection pool > 80% utilized"
          description: "{{ $value | humanizePercentage }} of max_connections in use. Investigate connection leaks or scale max_connections."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#postgresconnectionshigh"

      - alert: ValkeyDown
        # The metric is `redis_up`, not `valkey_up`: the exporter
        # (oliver006/redis_exporter — the one Valkey itself recommends)
        # emits the `redis_*` namespace, and we deliberately do not
        # override it with REDIS_EXPORTER_NAMESPACE. The names are the
        # exporter's output contract, not a coupling to Redis.
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Valkey is down"
          description: "valkey-exporter reports redis_up == 0. Cache misses will fall through to Postgres; rate limiting and session storage are degraded."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#valkeydown"

      - alert: ValkeyExporterMissing
        # ValkeyDown can only fire while the series exists. If the exporter
        # never comes up — wrong image tag, renamed scrape target, broken
        # network — `redis_up` is *absent* rather than 0, so `redis_up == 0`
        # evaluates over an empty vector and silently never fires, while
        # every dashboard panel goes blank. absent() is the only expression
        # that distinguishes "the thing is down" from "we stopped looking",
        # so this alert is what makes ValkeyDown trustworthy.
        expr: absent(redis_up)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Valkey exporter is not being scraped"
          description: "redis_up is absent — the exporter is down or the scrape target is misconfigured. ValkeyDown cannot fire while this is true."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#valkeyexportermissing"

      - alert: RateLimiterValkeyFallback
        # The rate limiter increments this counter when a Valkey call
        # fails and it falls back to the per-replica in-memory limiter.
        # The fallback is by design tolerant of brief blips, so we only
        # alert on a *sustained* stream (> 1/s for 5m), not single
        # timeouts — those are expected noise.
        #
        # sum() across replicas so we get one alert per cluster, not
        # one per replica.
        expr: sum(rate(ratelimit_valkey_failures_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiter sustained Valkey fallback"
          description: "The rate limiter has been falling back to its in-memory store at > 1/s for 5m. The shared limit is degraded across replicas; check Valkey health and network."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#ratelimitervalkeyfallback"

      - alert: GoquePayloadDecodeErrors
        # goque cancels (or retries) a task whose payload no longer decodes —
        # e.g. a payload schema change across a deploy. The cancel is otherwise
        # silent, so a bad deploy could quietly evaporate a batch of tasks. goque
        # exports this counter natively (labeled by task_type); alert on any
        # sustained rate so the drop is visible (RUK-179 / review finding M4).
        expr: sum by (task_type) (rate(goque_payload_decode_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "goque payload decode errors for task_type {{ $labels.task_type }}"
          description: "goque has been failing to decode {{ $labels.task_type }} task payloads for 5m. Tasks are being canceled or retried instead of processed — likely a payload schema mismatch from a recent deploy."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#goquepayloaddecodeerrors"

      - alert: PgDoormanPoolSaturated
        # pg_doorman exports pools-by-status as pg_doorman_pools_clients
        # {status="active|idle|waiting"} and the configured cap as
        # pg_doorman_pool_size, both keyed by (user, database). The previous
        # expr used pgdoorman_databases_pool_clients_active / _pool_size, which
        # this build does not emit — the rule could never fire (RUK-191).
        expr: |
          max by (user, database) (pg_doorman_pools_clients{status="active"})
          /
          max by (user, database) (pg_doorman_pool_size)
          > 0.9
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "pg_doorman pool {{ $labels.user }}@{{ $labels.database }} > 90% saturated"
          description: "Connection pooler is close to capacity for {{ $labels.user }}@{{ $labels.database }}. Investigate slow queries or raise pool_size."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#pgdoormanpoolsaturated"

      - alert: PgDoormanClientsWaiting
        # Clients waiting for a server connection means the pool is exhausted
        # right now — a more direct saturation signal than the ratio above.
        expr: max by (user, database) (pg_doorman_pools_clients{status="waiting"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "pg_doorman clients waiting for {{ $labels.user }}@{{ $labels.database }}"
          description: "Clients have been waiting for a pooled server connection for 2m. The pool is exhausted — raise pool_size or investigate long-held connections."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#pgdoormanpoolsaturated"

  # Host + per-container resource pressure, backed by node-exporter and
  # cAdvisor (added in RUK-191). Thresholds are intentionally conservative
  # starting points for the single-VM stack — tune as real load is observed.
  - name: maintmode.resources
    interval: 30s
    rules:
      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory > 90% used"
          description: "{{ $value | humanizePercentage }} of VM memory is in use for 5m. Risk of OOM kills; investigate the heaviest containers on the Resources dashboard."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#hostmemoryhigh"

      - alert: HostDiskLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
           /
           node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"})
          < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host root filesystem < 15% free"
          description: "Only {{ $value | humanizePercentage }} free on /. Postgres, Loki, and VictoriaMetrics volumes live here — free space or grow the disk before writes start failing."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#hostdisklow"

      - alert: HostCPUHigh
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU > 85% for 10m"
          description: "Sustained host CPU saturation ({{ $value | humanizePercentage }}). Identify the hot container on the Resources dashboard; the VM may need more cores."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#hostcpuhigh"

      - alert: ContainerMemoryHigh
        # Per-container working set as a share of total host memory. No
        # per-container limit is set in this stack, so we compare against the
        # host total rather than container_spec_memory_limit_bytes (unset).
        # service_name is the relabeled container name (RUK-191).
        expr: |
          sum by (service_name) (container_memory_working_set_bytes{name=~".+"})
          / scalar(node_memory_MemTotal_bytes)
          > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.service_name }} using > 50% of host memory"
          description: "{{ $labels.service_name }} has held more than half of the VM's memory for 5m. Investigate a leak or right-size the VM."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#containermemoryhigh"

      - alert: ContainerCPUHigh
        # Per-container CPU in cores vs total host cores.
        expr: |
          sum by (service_name) (rate(container_cpu_usage_seconds_total{name=~".+"}[5m]))
          / scalar(machine_cpu_cores)
          > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.service_name }} using > 85% of host CPU"
          description: "{{ $labels.service_name }} has consumed more than 85% of total host CPU for 10m. Investigate a hot loop or scale out."
          runbook_url: "https://github.com/maintmode-dev/maintmode-docs/blob/main/ops/alert-runbooks.md#containercpuhigh"
